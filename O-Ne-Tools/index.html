<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O-Ne 字卡工具入口</title>
<style>
:root{--bg:#0d121a;--panel:#151e2b;--panel2:#111925;--line:#2f4152;--line2:#47606f;--text:#f5efe7;--muted:#aebbc6;--teal:#29a6a7;--teal2:#70e0d3;--yellow:#ffbe37;--focus:#82ebe2}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse 70% 34% at 84% -6%,rgba(41,166,167,.14),transparent 74%),var(--bg);color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}
a{color:inherit}
.app{max-width:1280px;margin:auto;padding:22px 32px 40px}
.brand{display:flex;align-items:center;gap:9px;color:#a9dada;font-size:12px;font-weight:900;letter-spacing:.12em}
.brand b{color:var(--yellow);font-size:18px;line-height:1}
.ask{margin:14px 0 18px}
h1{margin:0 0 4px;font-size:clamp(26px,3vw,36px);line-height:1.3;font-weight:900}
h1 em{font-style:normal;color:var(--yellow)}
.hint{margin:0 0 14px;color:var(--muted);font-size:14px}
.search{width:100%;min-height:50px;padding:11px 15px;border:1px solid #56707b;border-radius:12px;background:#172633;color:#fff;font:inherit;font-size:16px}
.search::placeholder{color:#8fa3b0}
.search:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus)}
.rule{margin:12px 0 0;padding:10px 13px;border-left:3px solid var(--yellow);background:#1d1f22;border-radius:0 9px 9px 0;font-size:14px}
.results{display:grid;gap:8px;margin-top:12px}
.results[hidden],.rule[hidden]{display:none}
.result{display:flex;align-items:center;gap:13px;padding:10px 13px;border:1px solid var(--line2);border-radius:11px;background:var(--panel);text-decoration:none}
.result img{flex:0 0 96px;width:96px;height:52px;object-fit:contain}
.result strong{display:block;font-size:15px}
.result small{color:var(--muted);font-size:13px}
.empty{padding:14px;border:1px dashed var(--line2);border-radius:11px;color:var(--muted);font-size:14px}
.groups{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
.group{border:1px solid var(--line);border-radius:13px;background:var(--panel2);overflow:hidden}
.group summary{padding:10px 13px;font-size:14px;font-weight:900;color:#d5e4e8;cursor:pointer;list-style:none}
.group summary::-webkit-details-marker{display:none}
.rows{display:grid;gap:6px;padding:0 8px 8px}
.row{display:block;min-height:44px;padding:8px 10px;border:1px solid #33495b;border-radius:9px;background:var(--panel);text-decoration:none}
.row strong{display:block;font-size:14px;line-height:1.4}
.row span{display:block;margin-top:1px;color:var(--teal2);font-size:12px;font-weight:700}
.row:hover,.result:hover,.card:hover{border-color:#6fbfbc}
.block{margin-top:24px}
h2{margin:0 0 10px;font-size:18px;font-weight:900}
.recent{display:flex;flex-wrap:wrap;gap:8px}
.recent a{min-height:40px;padding:8px 12px;border:1px solid #385c68;border-radius:10px;background:#152f3b;font-size:13px;font-weight:800;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{display:flex;flex-direction:column;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}
.thumb{display:grid;place-items:center;height:128px;margin-bottom:9px;padding:6px;border-radius:9px;background:#0b1017;overflow:hidden}
.thumb img{max-width:100%;max-height:116px;object-fit:contain}
.card h3{margin:0;font-size:16px}
.card p{flex:1;margin:2px 0 9px;color:var(--muted);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.open{flex:1 1 auto;min-height:40px;padding:8px 10px;border-radius:9px;background:linear-gradient(125deg,#2da9a8,#23868e);color:#fff;font-size:14px;font-weight:900;text-align:center;text-decoration:none}
.sub{min-height:40px;padding:8px 10px;border:1px solid var(--line2);border-radius:9px;font-size:13px;font-weight:700;text-decoration:none}
footer{margin-top:26px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--muted);font-size:13px}
footer b{color:#fff}
footer nav{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px}
footer a{color:var(--teal2);font-weight:700}
a:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.error{color:#ff8d86}
@media(max-width:1180px){.groups{grid-template-columns:repeat(3,minmax(0,1fr))}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:820px){.groups{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:580px){.app{padding:14px 16px 28px}.groups{grid-template-columns:1fr;gap:8px}.grid{grid-template-columns:1fr}.group summary{min-height:44px;padding:11px 13px}.group summary::after{content:"▾";float:right;color:var(--muted)}.group[open] summary::after{content:"▴"}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="app">
  <div class="brand"><b aria-hidden="true">✦</b> O-NE MAKER LAB</div>
  <section class="ask">
    <h1>這段你想告訴觀眾<em>什麼</em>？</h1>
    <p class="hint">選下面的情境，直接開到對的字卡。回答不出希望觀眾注意什麼，就不要放字卡。</p>
    <label for="search" hidden>搜尋字卡</label>
    <input id="search" class="search" type="search" placeholder="🔎 或直接搜尋：價格、地點、開箱、片尾…" autocomplete="off">
    <p id="rule" class="rule" hidden></p>
    <div id="results" class="results" aria-live="polite" hidden></div>
  </section>
  <main>
    <section id="situations" class="groups" aria-label="依情境選字卡"><div class="empty">正在讀取工具清單…</div></section>
    <section id="recentBlock" class="block" hidden><h2>最近打開</h2><div id="recent" class="recent"></div></section>
    <section id="all" class="block"><h2>全部字卡</h2><div id="grid" class="grid"></div></section>
  </main>
  <footer>
    <div><b>共用規則：</b>卡體主底色維持正式 80% 透明規則，前景、文字與框線不整張淡化。字卡工具只使用語意代號；O-Ne 工作台的專案捷徑含 Drive／Docs 連結，實際內容由 Google 權限控管。</div>
    <nav aria-label="其他入口"><a href="./command-center.html">O-Ne 工作台</a><a href="./one-tools-registry-v1.json">給 AI 的卡種對照</a></nav>
  </footer>
</div>
<script>
(function(){
  'use strict';
  var recentKey='one-maker-recent-v1';
  var search=document.getElementById('search');
  var results=document.getElementById('results');
  var rule=document.getElementById('rule');
  var situations=document.getElementById('situations');
  var grid=document.getElementById('grid');
  var recentBlock=document.getElementById('recentBlock');
  var recent=document.getElementById('recent');
  var tools=[],guide={},recentIds=[];
  try{var raw=JSON.parse(localStorage.getItem(recentKey)||'[]');if(Array.isArray(raw))recentIds=raw.filter(function(id){return typeof id==='string'}).slice(0,4)}catch(e){}
  function el(tag,className,text){var node=document.createElement(tag);if(className)node.className=className;if(text!=null)node.textContent=text;return node}
  function findTool(id){return tools.find(function(tool){return tool.id===id})}
  function hrefOf(tool,mode){return tool.href+(mode?'&mode='+encodeURIComponent(mode):'')}
  function sample(tool){return './assets/card-samples/'+tool.id+'.webp'}
  function modeLabel(mode){return mode==='GET'?'GET!':mode}
  function remember(id){
    recentIds=[id].concat(recentIds.filter(function(item){return item!==id})).slice(0,4);
    try{localStorage.setItem(recentKey,JSON.stringify(recentIds))}catch(e){}
  }
  function link(className,tool,mode){var a=el('a',className);a.href=hrefOf(tool,mode);a.addEventListener('click',function(){remember(tool.id)});return a}
  function renderRecent(){
    recent.innerHTML='';
    var found=recentIds.map(findTool).filter(Boolean);
    recentBlock.hidden=!found.length;
    found.forEach(function(tool){var a=link('',tool);a.textContent=tool.name;recent.appendChild(a)});
  }
  function renderSituations(){
    situations.innerHTML='';
    var phone=window.matchMedia('(max-width:580px)').matches;
    (guide.situations||[]).forEach(function(group,index){
      var box=el('details','group');box.open=!phone||index===0;
      box.appendChild(el('summary','',group.group));
      var rows=el('div','rows');
      group.items.forEach(function(item){
        var tool=findTool(item.tool);if(!tool)return;
        var a=link('row',tool,item.mode);
        a.append(el('strong','',item.label),el('span','',tool.name+(item.mode?' '+modeLabel(item.mode):'')));
        rows.appendChild(a);
      });
      box.appendChild(rows);situations.appendChild(box);
    });
  }
  function renderGrid(){
    grid.innerHTML='';
    tools.forEach(function(tool){
      var g=tool.guide||{},card=el('article','card');card.dataset.toolId=tool.id;
      var thumb=el('div','thumb'),img=el('img');img.src=sample(tool);img.alt=tool.name+'的卡片樣子';img.loading='lazy';thumb.appendChild(img);
      var actions=el('div','actions'),open=link('open',tool);open.textContent='開啟'+tool.name;actions.appendChild(open);
      var ref=(g.references||[])[0];
      if(ref){var video=el('a','sub','範例影片 ↗');video.href=ref.url;video.target='_blank';video.rel='noopener';actions.appendChild(video)}
      var ai=el('a','sub','AI 助手');ai.href=tool.href+'&open=ai';actions.appendChild(ai);
      card.append(thumb,el('h3','',tool.name),el('p','',g.summary||''),actions);
      grid.appendChild(card);
    });
  }
  function hit(list,q){return (list||[]).some(function(value){var v=String(value).toLowerCase();return v.indexOf(q)>=0||q.indexOf(v)>=0&&v.length>1})}
  function renderSearch(){
    var q=search.value.trim().toLowerCase();
    results.innerHTML='';rule.hidden=true;
    if(!q){results.hidden=true;return}
    results.hidden=false;
    var matched=[];
    tools.forEach(function(tool){
      var g=tool.guide||{};
      var modes=(g.modes||[]).filter(function(mode){return hit(mode.aliases,q)||String(mode.mode).toLowerCase()===q});
      if(modes.length)modes.forEach(function(mode){matched.push({tool:tool,mode:mode.mode,note:mode.use_when})});
      else if(hit(g.aliases,q)||hit([tool.name,g.summary].concat(g.use_when||[]),q))matched.push({tool:tool,note:(g.use_when||[])[0]||g.summary});
    });
    var tie=(guide.tie_breaks||[]).find(function(item){return String(item.case).toLowerCase().indexOf(q)>=0||String(item.rule).toLowerCase().indexOf(q)>=0});
    if(tie&&matched.length>1){rule.textContent=tie.rule;rule.hidden=false}
    if(!matched.length){results.appendChild(el('div','empty','沒有對應的字卡。先想這段希望觀眾注意什麼；答不出來就不放，真的需要再回報缺口。'));return}
    matched.forEach(function(item){
      var a=link('result',item.tool,item.mode),img=el('img');img.src=sample(item.tool);img.alt='';
      var text=el('div');text.append(el('strong','',item.tool.name+(item.mode?' '+modeLabel(item.mode):'')),el('small','',item.note||''));
      a.append(img,text);results.appendChild(a);
    });
  }
  fetch('./one-tools-registry-v1.json?v=2400',{cache:'no-store'}).then(function(response){if(!response.ok)throw new Error('HTTP '+response.status);return response.json()}).then(function(registry){
    tools=(registry.tools||[]).filter(function(tool){return tool.status==='ready'&&tool.href});
    guide=registry.card_guide||{};
    document.documentElement.setAttribute('data-registry-version',registry.version||'unknown');
    renderSituations();renderGrid();renderRecent();renderSearch();
  }).catch(function(error){situations.innerHTML='';var box=el('div','empty error','工具清單暫時讀取失敗，請重新整理頁面。'+error.message);situations.appendChild(box)});
  search.addEventListener('input',renderSearch);
  document.addEventListener('keydown',function(event){
    if(event.isComposing||event.altKey||event.shiftKey)return;
    var active=document.activeElement,typing=active&&/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName);
    if(((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k')||(!typing&&!event.ctrlKey&&!event.metaKey&&event.key==='/')){event.preventDefault();search.focus();search.select()}
    if(event.key==='Escape'&&active===search&&search.value){search.value='';renderSearch()}
  });
})();
</script>
</body>
</html>
