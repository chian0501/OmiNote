<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O-Ne 字卡工具入口</title><style>:root{--bg:#0e1117;--panel:#151a23;--panel2:#101620;--border:#2a3240;--text:#f5efe7;--muted:#9ea7b3;--teal:#29A6A7;--purple:#70518a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.app{max-width:1380px;margin:auto;padding:32px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}h1{margin:0 0 8px;font-size:28px}.sub{color:var(--muted);font-size:13px;line-height:1.7}.stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 16px;min-width:150px}.stat b{display:block;font-size:22px;color:var(--teal)}.stat span{font-size:11px;color:var(--muted)}.ai-banner{margin-bottom:22px;padding:13px 16px;border:1px solid #4a3653;background:#201927;border-radius:13px;color:#d8c4df;font-size:12px;line-height:1.65}.ai-banner b{color:#fff}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.search{flex:1;min-width:240px;border:1px solid #394355;border-radius:10px;background:var(--panel2);color:white;padding:11px 13px;font-size:14px;outline:none}.filter{border:1px solid #394355;border-radius:999px;background:#171e29;color:#bfc7d3;padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer}.filter.active{background:var(--teal);color:#fff;border-color:var(--teal)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:linear-gradient(180deg,#171d27,#131923);border:1px solid var(--border);border-radius:15px;padding:16px;min-height:210px;display:flex;flex-direction:column;position:relative;overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#3b4453}.card.ready{border-color:#2b7777}.card.ready:before{background:var(--teal)}.meta{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}.group{font-size:11px;color:#a6b0bd}.badge{padding:3px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#272f3d;color:#9ca6b5}.badge.ready{background:#14312e;color:#8fd4c8}.title{font-size:18px;font-weight:900;margin-bottom:6px}.family{font-size:11px;color:#6faec1;margin-bottom:10px}.desc{font-size:12px;color:#aeb6c2;line-height:1.6;flex:1}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.action{border:0;border-radius:10px;padding:10px 8px;font-weight:900;background:#30394a;color:#8f99a8;cursor:not-allowed}.card.ready .direct{background:var(--teal);color:#fff;cursor:pointer}.card.ready .ai{background:#3a2942;color:#f0caef;border:1px solid #60416b;cursor:pointer}.footer{margin-top:24px;padding:14px 16px;background:var(--panel);border:1px solid var(--border);border-radius:13px;font-size:12px;color:#a8b1bd;line-height:1.7}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.hero{flex-direction:column}}@media(max-width:560px){.grid{grid-template-columns:1fr}.app{padding:20px}}</style></head><body><div class="app"><div class="hero"><div><h1>O-Ne 字卡工具入口</h1><div class="sub">原工具是主入口；需要 AI 時才使用 AI 幫填。不同狀態、數量或變體仍在同一編輯器內切換。</div></div><div class="stat"><b>6 / 14</b><span>目前可使用</span></div></div><div class="ai-banner"><b>✨ ChatGPT Pro AI Bridge 是選用功能</b><br>原工具永遠是主入口；已接 AI 的工具才會顯示「AI 幫我填」。對話卡 V1.3.5 已完成 24／24 表情載入驗證，AI Bridge 待後續接入。</div><div class="toolbar"><input id="search" class="search" placeholder="搜尋：移動、選項、對話、評分…"><button class="filter active" data-group="全部">全部</button><button class="filter" data-group="任務／事件">任務／事件</button><button class="filter" data-group="路線／導航">路線／導航</button><button class="filter" data-group="選擇／確認">選擇／確認</button><button class="filter" data-group="對話／角色">對話／角色</button><button class="filter" data-group="資訊／閱讀">資訊／閱讀</button><button class="filter" data-group="結算／結果">結算／結果</button><button class="filter" data-group="玩家／支援">玩家／支援</button></div><div id="grid" class="grid"></div><div class="footer"><b>規則：</b>直接編輯永遠保留；AI 只作輔助填欄位，不取代原工具、不改版型。所有卡體主底色固定 80% 透明，其他元件維持正式透明度。</div></div><script>
const tools=[
{id:'general',name:'一般卡',family:'一般卡',group:'任務／事件',desc:'HERE｜目前位置、場景定位、畫面主題',status:'ready',direct:'./general-card.html?v=101',ai:'./ai-card.html?tool=general&v=12'},
{id:'trigger',name:'觸發卡',family:'觸發卡',group:'任務／事件',desc:'EVENT／DONE!／FAIL｜事件觸發、成功、失敗',status:'ready',direct:'./trigger-card.html?v=101',ai:'./ai-card.html?tool=trigger&v=12'},
{id:'persistent',name:'常駐卡',family:'常駐卡',group:'任務／事件',desc:'MISSION／DONE!／FAIL｜任務中、成功、失敗',status:'ready',direct:'./persistent-card.html?v=102',ai:'./ai-card.html?tool=persistent&v=12'},
{id:'move',name:'移動卡',family:'移動卡',group:'路線／導航',desc:'MOVE｜站點增減、每段實線／虛線、白色／橘色版',status:'ready',direct:'./move-card.html?v=105',ai:'./ai-card.html?tool=move&v=12'},
{id:'choice',name:'選項卡',family:'選項卡',group:'選擇／確認',desc:'SELECT｜自由增減選項；每項獨立亮／暗',status:'ready',direct:'./choice-card.html?v=100',ai:'./ai-card.html?tool=choice&v=12'},
{id:'challenge',name:'挑戰任務',family:'選項卡',group:'選擇／確認',desc:'接受／放棄、確認／取消在同一工具',status:'planned'},
{id:'dialogue',name:'對話卡',family:'對話卡',group:'對話／角色',desc:'正式框＋完整獨立透明頭像；左右角色／表情／名稱獨立；24／24 表情已驗證',status:'ready',direct:'./dialogue-card.html?v=135',ai:''},
{id:'reading',name:'說明字卡',family:'說明／評分',group:'資訊／閱讀',desc:'左圖右文大型閱讀卡',status:'planned'},
{id:'rating',name:'評分卡',family:'說明／評分',group:'資訊／閱讀',desc:'品鑑＋價格／心得＋店家資訊',status:'planned'},
{id:'settlement',name:'片尾結算',family:'片尾結算',group:'結算／結果',desc:'五列結果＋總結＋NEXT',status:'planned'},
{id:'player1',name:'玩家 1',family:'固定支援',group:'玩家／支援',desc:'1P｜導航藍',status:'planned'},
{id:'player2',name:'玩家 2',family:'固定支援',group:'玩家／支援',desc:'2P｜紅色',status:'planned'},
{id:'saving',name:'Saving',family:'固定支援',group:'玩家／支援',desc:'Saving...｜章節／存檔轉場',status:'planned'},
{id:'mini_show',name:'小劇場',family:'固定支援',group:'玩家／支援',desc:'小劇場識別層',status:'planned'}];
let group='全部';const grid=document.getElementById('grid'),search=document.getElementById('search');function render(){const q=search.value.trim().toLowerCase();grid.innerHTML='';tools.filter(t=>(group==='全部'||t.group===group)&&(!q||(t.name+' '+t.family+' '+t.group+' '+t.desc).toLowerCase().includes(q))).forEach(t=>{const el=document.createElement('div');el.className='card '+(t.status==='ready'?'ready':'');const actions=t.status==='ready'?`<div class="actions"><button class="action direct">直接編輯</button>${t.ai?'<button class="action ai">✨ AI 幫我填</button>':'<button class="action" disabled>AI 待接</button>'}</div>`:'<div class="actions"><button class="action" style="grid-column:1/-1" disabled>尚未建立</button></div>';el.innerHTML=`<div class="meta"><span class="group">${t.group}</span><span class="badge ${t.status==='ready'?'ready':''}">${t.status==='ready'?'可使用':'待建立'}</span></div><div class="title">${t.name}</div><div class="family">${t.family}</div><div class="desc">${t.desc}</div>${actions}`;if(t.status==='ready'){el.querySelector('.direct').onclick=()=>location.href=t.direct;if(t.ai)el.querySelector('.ai').onclick=()=>location.href=t.ai}grid.appendChild(el)})}search.oninput=render;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');group=b.dataset.group;render()});render();
</script></body></html>
