<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O-Ne 字卡工具入口</title><style>
:root{--bg:#0e1117;--panel:#151a23;--panel2:#101620;--border:#2a3240;--text:#f5efe7;--muted:#9ea7b3;--teal:#29A6A7;--blue:#3F8FB7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.app{max-width:1380px;margin:auto;padding:32px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}h1{margin:0 0 8px;font-size:28px}.sub{color:var(--muted);font-size:13px;line-height:1.7}.stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 16px;min-width:150px}.stat b{display:block;font-size:22px;color:var(--teal)}.stat span{font-size:11px;color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.search{flex:1;min-width:240px;border:1px solid #394355;border-radius:10px;background:var(--panel2);color:white;padding:11px 13px;font-size:14px;outline:none}.filter{border:1px solid #394355;border-radius:999px;background:#171e29;color:#bfc7d3;padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer}.filter.active{background:var(--teal);color:#fff;border-color:var(--teal)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:linear-gradient(180deg,#171d27,#131923);border:1px solid var(--border);border-radius:15px;padding:16px;min-height:190px;display:flex;flex-direction:column;position:relative;overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#3b4453}.card.ready{border-color:#2b7777}.card.ready:before{background:var(--teal)}.meta{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}.group{font-size:11px;color:#a6b0bd}.badge{padding:3px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#272f3d;color:#9ca6b5}.badge.ready{background:#14312e;color:#8fd4c8}.title{font-size:18px;font-weight:900;margin-bottom:6px}.family{font-size:11px;color:#6faec1;margin-bottom:10px}.desc{font-size:12px;color:#aeb6c2;line-height:1.6;flex:1}.action{margin-top:16px;width:100%;border:0;border-radius:10px;padding:10px 12px;font-weight:900;background:#30394a;color:#8f99a8;cursor:not-allowed}.card.ready .action{background:var(--teal);color:#fff;cursor:pointer}.footer{margin-top:24px;padding:14px 16px;background:var(--panel);border:1px solid var(--border);border-radius:13px;font-size:12px;color:#a8b1bd;line-height:1.7}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.hero{flex-direction:column}}@media(max-width:560px){.grid{grid-template-columns:1fr}.app{padding:20px}}
</style></head><body><div class="app"><div class="hero"><div><h1>O-Ne 字卡工具入口</h1><div class="sub">一個功能只留一個入口。不同狀態、數量或變體，都在編輯器裡切換。</div></div><div class="stat"><b id="count">5 / 14</b><span>目前可使用</span></div></div><div class="toolbar"><input id="search" class="search" placeholder="搜尋：移動、選項、對話、評分…"><button class="filter active" data-group="全部">全部</button><button class="filter" data-group="任務／事件">任務／事件</button><button class="filter" data-group="路線／導航">路線／導航</button><button class="filter" data-group="選擇／確認">選擇／確認</button><button class="filter" data-group="對話／角色">對話／角色</button><button class="filter" data-group="資訊／閱讀">資訊／閱讀</button><button class="filter" data-group="結算／結果">結算／結果</button><button class="filter" data-group="玩家／支援">玩家／支援</button></div><div id="grid" class="grid"></div><div class="footer"><b>整理原則：</b>移動卡不拆跨國版；選項卡不拆 2 項版；挑戰任務不拆接受／放棄版；觸發卡與常駐卡的狀態都在各自編輯器內切換；選項卡可自由增減且逐項亮／暗；所有卡體主底色固定 80% 透明，其他元件維持原透明度；對話卡已確認為正式卡；玩家 1 為移動卡同系藍色，玩家 2 為紅色。</div></div><script>
const tools=[{"id":"general","name":"一般卡","family":"一般卡","group":"任務／事件","desc":"HERE｜目前位置、場景定位、畫面主題","status":"ready","href":"./general-card.html?v=100"},{"id":"trigger","name":"觸發卡","family":"觸發卡","group":"任務／事件","desc":"EVENT／DONE!／FAIL｜同一工具切換事件觸發、成功、失敗；可改大標、副標與進度","status":"ready","href":"./trigger-card.html?v=100"},{"id":"persistent","name":"常駐卡","family":"常駐卡","group":"任務／事件","desc":"MISSION／DONE!／FAIL｜同一工具切換任務中、成功、失敗；可改任務文字與進度","status":"ready","href":"./persistent-card.html?v=101"},{"id":"move","name":"移動卡","family":"移動卡","group":"路線／導航","desc":"MOVE｜動態增減站點、每段實線／虛線、白色／橘色版；跨國也在同一工具處理","status":"ready","href":"./move-card.html?v=104"},{"id":"choice","name":"選項卡","family":"選項卡","group":"選擇／確認","desc":"SELECT｜自由增減選項；每項可獨立切亮／暗，可同時亮多項","status":"ready","href":"./choice-card.html?v=100"},{"id":"challenge","name":"挑戰任務","family":"選項卡","group":"選擇／確認","desc":"同一工具內切換接受／放棄與確認／取消","status":"planned","href":""},{"id":"dialogue","name":"對話卡","family":"對話卡","group":"對話／角色","desc":"正式對話卡｜Omi／涅特／Kuma／Nomi／NPC／雙人；角色與表情在同一工具內選擇","status":"planned","href":""},{"id":"reading","name":"說明字卡","family":"說明／評分","group":"資訊／閱讀","desc":"COL-02 reading_card｜左圖右文大型閱讀卡","status":"planned","href":""},{"id":"rating","name":"評分卡","family":"說明／評分","group":"資訊／閱讀","desc":"COL-02｜四列品鑑＋價格／心得＋店家資訊","status":"planned","href":""},{"id":"settlement","name":"片尾結算","family":"片尾結算","group":"結算／結果","desc":"QST-03｜五列結果＋總結＋NEXT","status":"planned","href":""},{"id":"player1","name":"玩家 1","family":"固定支援","group":"玩家／支援","desc":"1P｜藍色玩家識別；與移動卡導航藍同系，不使用青綠","status":"planned","href":""},{"id":"player2","name":"玩家 2","family":"固定支援","group":"玩家／支援","desc":"2P｜紅色玩家識別","status":"planned","href":""},{"id":"saving","name":"Saving","family":"固定支援","group":"玩家／支援","desc":"Saving...｜章節／存檔轉場","status":"planned","href":""},{"id":"mini_show","name":"小劇場","family":"固定支援","group":"玩家／支援","desc":"MINI_SHOW_BADGE｜小劇場識別層","status":"planned","href":""}];
let group='全部';const grid=document.querySelector('#grid'),search=document.querySelector('#search');function render(){const q=search.value.trim().toLowerCase();const list=tools.filter(t=>(group==='全部'||t.group===group)&&(!q||(`${t.name} ${t.family} ${t.group} ${t.desc}`).toLowerCase().includes(q)));grid.innerHTML='';list.forEach(t=>{const el=document.createElement('div');el.className='card '+(t.status==='ready'?'ready':'');el.innerHTML=`<div class="meta"><span class="group">${t.group}</span><span class="badge ${t.status==='ready'?'ready':''}">${t.status==='ready'?'可使用':'待建立'}</span></div><div class="title">${t.name}</div><div class="family">${t.family}</div><div class="desc">${t.desc}</div><button class="action">${t.status==='ready'?'進入編輯器':'尚未建立'}</button>`;if(t.status==='ready')el.querySelector('.action').onclick=()=>location.href=t.href;grid.appendChild(el)})}search.oninput=render;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');group=b.dataset.group;render()});render();
</script></body></html>
