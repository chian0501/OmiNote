<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O-Ne 字卡工具入口</title>
<link rel="stylesheet" href="./one-tools-ui-v1.css?v=1310">
<style>
:root{--bg:#0e1117;--panel:#151a23;--panel2:#101620;--border:#2a3240;--text:#f5efe7;--muted:#aeb8c5;--teal:#29A6A7;--purple:#70518a;--yellow:#FFBE37}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.app{max-width:1380px;margin:auto;padding:32px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:20px}.hero-copy{max-width:850px}h1{margin:0 0 8px;font-size:30px}.sub{color:var(--muted);font-size:15px;line-height:1.7}.hero-side{display:grid;gap:10px;min-width:205px}.stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:13px 16px}.stat b{display:block;font-size:24px;color:var(--teal)}.stat span{font-size:13px;color:var(--muted)}.command-link{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid #4f6075;border-radius:11px;background:#202b39;color:#edf4fb;text-decoration:none;font-size:14px;font-weight:900}.command-link:hover{border-color:var(--teal)}.notice{margin-bottom:22px;padding:15px 17px;border:1px solid #4a3653;background:#201927;border-radius:13px;color:#dbcde0;font-size:14px;line-height:1.7}.notice b{color:#fff}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.search{flex:1;min-width:260px;border:1px solid #445066;border-radius:10px;background:var(--panel2);color:white;padding:11px 13px;font-size:15px;outline:none}.filter{border:1px solid #445066;border-radius:999px;background:#171e29;color:#c6cfda;padding:9px 13px;font-size:13px;font-weight:800;cursor:pointer}.filter.active{background:var(--teal);color:#fff;border-color:var(--teal)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:linear-gradient(180deg,#171d27,#131923);border:1px solid var(--border);border-radius:15px;padding:17px;min-height:236px;display:flex;flex-direction:column;position:relative;overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#3b4453}.card.ready{border-color:#2b7777}.card.ready:before{background:var(--teal)}.card.candidate{border-color:#8b6b24}.card.candidate:before{background:var(--yellow)}.meta{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}.group{font-size:13px;color:#b4becb}.badge{padding:4px 9px;border-radius:999px;font-size:11px;font-weight:900}.badge.ready{background:#14312e;color:#8fd4c8}.badge.candidate{background:#3b2d12;color:#ffd978}.title{font-size:20px;font-weight:900;margin-bottom:6px}.family{font-size:13px;color:#7fc5d8;margin-bottom:10px}.desc{font-size:14px;color:#bdc6d1;line-height:1.6;flex:1}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.action{display:flex;align-items:center;justify-content:center;min-height:44px;border:0;border-radius:10px;padding:9px;font-weight:900;text-decoration:none;font-size:14px}.direct{background:var(--teal);color:#fff}.ai{background:#3a2942;color:#f0caef;border:1px solid #60416b}.built-in{border:1px dashed #435064;background:#171e29;color:#b7c1ce;font-size:12px;text-align:center}.empty{grid-column:1/-1;padding:30px;border:1px dashed #3a4557;border-radius:14px;color:var(--muted);text-align:center}.footer{margin-top:24px;padding:15px 17px;background:var(--panel);border:1px solid var(--border);border-radius:13px;font-size:14px;color:#b7c0cb;line-height:1.7}.footer b{color:#fff}.error{color:#ff8d86}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.hero{flex-direction:column}.hero-side{width:100%;grid-template-columns:1fr 1fr}}@media(max-width:580px){.grid{grid-template-columns:1fr}.app{padding:20px}.hero-side{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.filter{flex:1 1 auto}}
</style>
<script src="./one-tools-ui-v1.js?v=1310"></script>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="hero-copy">
      <h1>O-Ne 字卡工具</h1>
      <div class="sub">先選卡型，直接進編輯器；版型、文字與圖片都在同一頁完成。暫存、專案搬移、批次輸出與 AI 格式統一放在各工具最下方。</div>
    </div>
    <div class="hero-side">
      <div class="stat"><b id="statNum">載入中</b><span>目前可用 Maker Tools</span></div>
      <a class="command-link" href="./command-center.html">開啟 Command Center</a>
    </div>
  </header>
  <div class="notice"><b>最簡單的使用方式：</b>① 開啟工具 → ② 編輯並看右側預覽 → ③ 到頁面最下方儲存或輸出。每個工具內都有可複製的 AI JSON 指令；五種常用卡另有 AI 助手可直接套用。</div>
  <div class="toolbar" aria-label="工具篩選">
    <input id="search" class="search" type="search" placeholder="搜尋工具或用途，例如：圖片、評分、移動、對話">
    <button class="filter active" data-group="全部">全部</button>
    <button class="filter" data-group="任務／事件">任務／事件</button>
    <button class="filter" data-group="路線／導航">路線／導航</button>
    <button class="filter" data-group="選擇／確認">選擇／確認</button>
    <button class="filter" data-group="對話／角色">對話／角色</button>
    <button class="filter" data-group="資訊／閱讀">資訊／閱讀</button>
    <button class="filter" data-group="縮圖／品牌">縮圖／品牌</button>
    <button class="filter" data-group="效果／狀態">效果／狀態</button>
    <button class="filter" data-group="結算／結果">結算／結果</button>
  </div>
  <main id="grid" class="grid" aria-live="polite"><div class="empty">正在讀取工具清單…</div></main>
  <div class="footer"><b>共用規則：</b>卡體主底色維持正式 80% 透明規則，前景、文字與框線不整張淡化。公開工具只使用語意代號，不包含內部 Drive／Docs 識別碼。</div>
</div>
<script>
(function(){
  'use strict';
  var tools=[];
  var group='全部';
  var grid=document.getElementById('grid');
  var search=document.getElementById('search');
  function text(value){return String(value==null?'':value)}
  function action(label,href,className){var a=document.createElement('a');a.className='action '+className;a.href=href;a.textContent=label;return a}
  function render(){
    var q=search.value.trim().toLowerCase();
    var shown=tools.filter(function(tool){var hay=[tool.name,tool.family,tool.group,tool.desc,(tool.features||[]).join(' ')].join(' ').toLowerCase();return(group==='全部'||tool.group===group)&&(!q||hay.indexOf(q)>=0)});
    grid.innerHTML='';
    if(!shown.length){var empty=document.createElement('div');empty.className='empty';empty.textContent='找不到符合的工具，換個關鍵字試試看。';grid.appendChild(empty);return}
    shown.forEach(function(tool){
      var card=document.createElement('article');card.className='card '+tool.status;
      var meta=document.createElement('div');meta.className='meta';
      var groupNode=document.createElement('span');groupNode.className='group';groupNode.textContent=text(tool.group);
      var badge=document.createElement('span');badge.className='badge '+tool.status;badge.textContent=tool.status==='ready'?'可使用':'候選測試';meta.append(groupNode,badge);
      var title=document.createElement('div');title.className='title';title.textContent=text(tool.name);
      var family=document.createElement('div');family.className='family';family.textContent=text(tool.family);
      var desc=document.createElement('div');desc.className='desc';desc.textContent=text(tool.desc||'開啟工具查看可編輯內容。');
      var actions=document.createElement('div');actions.className='actions';actions.appendChild(action('開啟'+text(tool.name),tool.href,'direct'));
      if(tool.ai_href) actions.appendChild(action('AI 助手',tool.ai_href,'ai'));
      else {var built=document.createElement('div');built.className='action built-in';built.textContent='內建 AI JSON 格式';actions.appendChild(built)}
      card.append(meta,title,family,desc,actions);grid.appendChild(card);
    });
  }
  fetch('./one-tools-registry-v1.json?v=2360',{cache:'no-store'}).then(function(response){if(!response.ok)throw new Error('HTTP '+response.status);return response.json()}).then(function(registry){
    tools=(registry.tools||[]).filter(function(tool){return (tool.status==='ready'||tool.status==='candidate')&&tool.href});
    document.getElementById('statNum').textContent=tools.length+' 個';
    document.documentElement.setAttribute('data-registry-version',registry.version||'unknown');
    render();
  }).catch(function(error){grid.innerHTML='';var empty=document.createElement('div');empty.className='empty error';empty.textContent='工具清單暫時讀取失敗，請重新整理頁面。'+text(error.message);grid.appendChild(empty);document.getElementById('statNum').textContent='讀取失敗'});
  search.addEventListener('input',render);
  document.querySelectorAll('.filter').forEach(function(button){button.addEventListener('click',function(){document.querySelectorAll('.filter').forEach(function(item){item.classList.remove('active')});button.classList.add('active');group=button.dataset.group;render()})});
})();
</script>
</body>
</html>
