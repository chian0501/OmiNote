<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O‑Ne 移動卡生成器 V1.0.1</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:#0e1117; color:#f3efe8; font-family:"Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif; }
  .app { max-width:1380px; margin:0 auto; padding:26px; }
  h1 { margin:0 0 8px; font-size:24px; }
  .sub { color:#9ea7b3; font-size:13px; margin-bottom:22px; line-height:1.7; }
  .grid { display:grid; grid-template-columns:470px 1fr; gap:22px; align-items:start; }
  .panel { background:#151a23; border:1px solid #2a3240; border-radius:16px; padding:18px; box-shadow:0 12px 30px rgba(0,0,0,.25); }
  .section-title { font-size:14px; font-weight:800; margin:0 0 12px; color:#f0a8cf; }
  .note { font-size:12px; color:#c4cad3; background:#101620; border:1px solid #273244; border-radius:10px; padding:10px 12px; line-height:1.7; margin-bottom:12px; }
  label { display:block; font-size:12px; font-weight:700; color:#b9c0ca; margin:12px 0 6px; }
  input, select { width:100%; border:1px solid #394355; border-radius:9px; background:#101620; color:white; padding:10px 11px; font-size:14px; outline:none; }
  input:focus, select:focus { border-color:#29A6A7; }
  input.bad, select.bad { border-color:#FD4537; background:#241415; }
  .row2 { display:grid; grid-template-columns:1fr 140px; gap:10px; }
  .preview-wrap { min-height:520px; display:flex; flex-direction:column; justify-content:center; align-items:center; background:linear-gradient(45deg,#222832 25%,transparent 25%),linear-gradient(-45deg,#222832 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#222832 75%),linear-gradient(-45deg,transparent 75%,#222832 75%); background-size:24px 24px; background-position:0 0,0 12px,12px -12px,-12px 0; border-radius:14px; overflow:hidden; padding:32px 18px; }
  canvas { width:min(100%, 980px); height:auto; filter:drop-shadow(0 8px 18px rgba(0,0,0,.26)); }
  .status { min-height:22px; margin-top:12px; font-size:12px; color:#8fd4c8; line-height:1.6; }
  .status.error { color:#ff7770; }
  .buttons { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  button { border:0; border-radius:9px; padding:11px 15px; font-weight:800; cursor:pointer; background:#29A6A7; color:white; }
  button.secondary { background:#30394a; }
  button.orange { background:#cf7a17; }
  button.small { padding:8px 10px; font-size:12px; }
  .mini { margin-top:14px; padding:12px; border-radius:10px; background:#101620; color:#aeb7c3; font-size:12px; line-height:1.7; }
  .lock { color:#ffcf6d; }
  .oktag { display:inline-block; padding:2px 8px; border-radius:999px; background:#14312e; color:#8fd4c8; font-size:11px; margin-left:6px; }
  .listbox { border:1px solid #273244; background:#101620; border-radius:12px; padding:10px; margin-top:10px; }
  .item { border:1px solid #2c3545; border-radius:10px; padding:10px; margin-bottom:10px; background:#121925; }
  .item:last-child { margin-bottom:0; }
  .item-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; color:#dce3ed; font-size:12px; font-weight:800; }
  .dim { color:#8f99a8; font-size:11px; }
  @media(max-width:1020px) { .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="app">
  <h1>O‑Ne 移動卡生成器 <span style="font-size:12px;color:#8c96a5">V1.0.1</span></h1>
  <div class="sub">可自由增加／減少站點（2～8 站），站名會自動縮字、避邊。每段線可選實線／虛線，可直接輸出白色版／橘色版透明 PNG。</div>
  <div class="grid">
    <div class="panel">
      <div class="section-title">01｜內容輸入</div>
      <div class="note">規則：至少 2 站，最多 8 站。路段數會自動跟著站點數 - 1。站名位置會依文字寬度自動移到安全區。</div>
      <label>預覽狀態</label>
      <select id="previewState"><option value="white">WHITE｜白色版預覽</option><option value="orange">ORANGE｜橘色版預覽</option></select>
      <label>標題</label><input id="title" value="關西國際機場(KIX) → 北浜">
      <div class="buttons"><button id="addStation" class="small">＋ 增加站點</button><button id="removeStation" class="small secondary">－ 刪除最後站點</button></div>
      <div class="listbox"><div class="item-head"><div>站點與路段設定</div><div class="dim">站點數：<span id="countBadge">4</span></div></div><div id="stationList"></div></div>
      <div id="status" class="status">READY｜可輸出 <span class="oktag">V1.0.1</span></div>
      <div class="buttons"><button id="downloadWhite">輸出白色版 PNG</button><button id="downloadOrange" class="orange">輸出橘色版 PNG</button><button id="downloadBoth" class="secondary">一次輸出兩版</button><button id="jsonBtn" class="secondary">輸出欄位 JSON</button><button id="reset" class="secondary">回復示例</button></div>
      <div class="mini"><b class="lock">🔒 固定不改：</b>卡體、切角、MOVE、正式色彩、透明背景、整體版型。<br><b>字位策略：</b>先縮字，再限制在安全區；真的太長才 BLOCKED。</div>
    </div>
    <div class="panel"><div class="section-title">02｜正式母版即時預覽</div><div class="preview-wrap"><canvas id="c" width="721" height="126"></canvas></div></div>
  </div>
</div>

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const base=new Image(), move=new Image();
const defaults={previewState:'white',title:'關西國際機場(KIX) → 北浜',stations:['關西國際機場(KIX)','關西空港站','天下茶屋','北浜'],segments:[{name:'走這條路',style:'solid'},{name:'南海電鐵',style:'solid'},{name:'堺筋線',style:'solid'}]};
let data=JSON.parse(JSON.stringify(defaults));
const $=id=>document.getElementById(id), cream='#FDF3E7', white='#FFFFFF', orange='#FFBE37';
function font(weight,px){return `${weight} ${px}px "Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif`;}
function clamp(v,min,max){return Math.min(max,Math.max(min,v));}
function fitText(text,maxWidth,startSize,minSize,weight=700){let size=startSize;while(size>=minSize){ctx.font=font(weight,size);const w=ctx.measureText(text).width;if(w<=maxWidth)return{size,width:w,ok:true};size--;}ctx.font=font(weight,minSize);return{size:minSize,width:ctx.measureText(text).width,ok:false};}
function drawSegment(x1,x2,y,style,color){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=5;ctx.lineCap='round';ctx.setLineDash(style==='dashed'?[10,8]:[]);ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();ctx.restore();}
function drawCenteredText(text,centerX,y,maxWidth,startSize,minSize,color,weight=700){const fit=fitText(text,maxWidth,startSize,minSize,weight);ctx.font=font(weight,fit.size);ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText(text,centerX,y);return !fit.ok;}
function drawSmartStationText(text,nodeX,y,idx,total,color){const isFirst=idx===0,isLast=idx===total-1,fit=fitText(text,150,13,8,700),safeLeft=14,safeRight=707,textW=fit.width;let x;if(isFirst)x=Math.max(nodeX-textW*.35,safeLeft);else if(isLast)x=Math.min(nodeX-textW*.65,safeRight-textW);else{x=nodeX-textW/2;x=clamp(x,safeLeft,safeRight-textW);}ctx.font=font(700,fit.size);ctx.fillStyle=color;ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText(text,x,y);return !fit.ok;}
function getNodeXs(count){const start=84,end=669;if(count===1)return[start];const step=(end-start)/(count-1);return Array.from({length:count},(_,i)=>start+step*i);}
function renderForm(){$('countBadge').textContent=data.stations.length;const box=$('stationList');box.innerHTML='';data.stations.forEach((station,i)=>{const wrap=document.createElement('div');wrap.className='item';let html=`<div class="item-head"><div>站點 ${i+1}</div><div class="dim">${i===0?'起點':(i===data.stations.length-1?'終點':'中繼點')}</div></div><label style="margin-top:0">站點名稱</label><input type="text" data-kind="station" data-index="${i}" value="${station.replace(/"/g,'&quot;')}">`;if(i<data.stations.length-1){const seg=data.segments[i]||{name:'',style:'solid'};html+=`<div class="row2"><div><label>路段名稱</label><input type="text" data-kind="segment-name" data-index="${i}" value="${(seg.name||'').replace(/"/g,'&quot;')}"></div><div><label>線型</label><select data-kind="segment-style" data-index="${i}"><option value="solid" ${seg.style==='solid'?'selected':''}>實線</option><option value="dashed" ${seg.style==='dashed'?'selected':''}>虛線</option></select></div></div>`;}wrap.innerHTML=html;box.appendChild(wrap);});box.querySelectorAll('input, select').forEach(el=>{el.addEventListener(el.tagName==='SELECT'?'change':'input',e=>{const kind=e.target.dataset.kind,idx=Number(e.target.dataset.index);if(kind==='station')data.stations[idx]=e.target.value;if(kind==='segment-name')data.segments[idx].name=e.target.value;if(kind==='segment-style')data.segments[idx].style=e.target.value;render();});});}
function render(stateOverride=null){if(!base.complete||!move.complete)return false;const state=stateOverride||$('previewState').value,routeColor=state==='orange'?orange:white;ctx.clearRect(0,0,721,126);ctx.drawImage(base,0,0,721,126);ctx.drawImage(move,29,18,141,33);let blocked=false;const titleFit=fitText($('title').value,505,26,15,800);$('title').classList.toggle('bad',!titleFit.ok);ctx.font=font(800,titleFit.size);ctx.fillStyle=cream;ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText($('title').value,182,52);blocked=blocked||!titleFit.ok;const count=data.stations.length,xs=getNodeXs(count),routeY=85,segmentLabelY=73,stationLabelY=113;for(let i=0;i<count-1;i++)drawSegment(xs[i],xs[i+1],routeY,data.segments[i]?.style||'solid',routeColor);ctx.fillStyle=routeColor;xs.forEach(x=>{ctx.beginPath();ctx.arc(x,routeY,7,0,Math.PI*2);ctx.fill();});for(let i=0;i<count-1;i++){const mid=(xs[i]+xs[i+1])/2,maxW=Math.min(140,Math.max(70,(xs[i+1]-xs[i])-20));blocked=drawCenteredText(data.segments[i]?.name||'',mid,segmentLabelY,maxW,14,9,routeColor,700)||blocked;}for(let i=0;i<count;i++)blocked=drawSmartStationText(data.stations[i],xs[i],stationLabelY,i,count,routeColor)||blocked;const st=$('status');document.querySelectorAll('#downloadWhite,#downloadOrange,#downloadBoth').forEach(btn=>btn.disabled=blocked);if(blocked){st.innerHTML='BLOCKED｜仍有欄位長到超出安全限制，請縮短文字 <span class="oktag">V1.0.1</span>';st.className='status error';}else{st.innerHTML='READY｜可輸出白色版／橘色版 <span class="oktag">V1.0.1</span>';st.className='status';}return blocked;}
function addStation(){if(data.stations.length>=8)return;data.stations.push('新站點');data.segments.push({name:'交通方式',style:'solid'});renderForm();render();}
function removeStation(){if(data.stations.length<=2)return;data.stations.pop();data.segments.pop();renderForm();render();}
function downloadCurrentState(state,filename){const blocked=render(state);if(blocked)return;const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=filename;a.click();render();}
$('previewState').addEventListener('change',render);$('title').addEventListener('input',render);$('addStation').addEventListener('click',addStation);$('removeStation').addEventListener('click',removeStation);$('downloadWhite').onclick=()=>downloadCurrentState('white','O-Ne_NAV-01_MOVE_WHITE.png');$('downloadOrange').onclick=()=>downloadCurrentState('orange','O-Ne_NAV-01_MOVE_ORANGE.png');$('downloadBoth').onclick=()=>{const blocked=render('white');if(blocked)return;downloadCurrentState('white','O-Ne_NAV-01_MOVE_WHITE.png');setTimeout(()=>downloadCurrentState('orange','O-Ne_NAV-01_MOVE_ORANGE.png'),250);};$('jsonBtn').onclick=()=>{const payload={template_id:'1KpEX-97ObOHxLxbnLmK-3lxlVlBsvCPA',template_name:'00_移動卡.psd',component_id:'NAV-01',title:$('title').value,preview_state:$('previewState').value.toUpperCase(),stations:data.stations,segments:data.segments};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='O-Ne_MOVE_data_v101.json';a.click();URL.revokeObjectURL(a.href);};$('reset').onclick=()=>{data=JSON.parse(JSON.stringify(defaults));$('previewState').value=defaults.previewState;$('title').value=defaults.title;renderForm();render();};
function boot(){renderForm();render();}
base.onload=boot;move.onload=boot;base.onerror=()=>{$('status').textContent='ERROR｜底圖載入失敗';};move.onerror=()=>{$('status').textContent='ERROR｜MOVE 標籤載入失敗';};base.src=baseSrc;move.src=moveSrc;
