<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O-Ne 移動卡生成器 V1.0.4</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0e1117;color:#f3efe8;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.app{max-width:1380px;margin:auto;padding:26px}h1{margin:0 0 8px;font-size:24px}.sub{color:#9ea7b3;font-size:13px;margin-bottom:22px;line-height:1.7}.grid{display:grid;grid-template-columns:470px 1fr;gap:22px;align-items:start}.panel{background:#151a23;border:1px solid #2a3240;border-radius:16px;padding:18px;box-shadow:0 12px 30px rgba(0,0,0,.25)}.section-title{font-size:14px;font-weight:800;margin:0 0 12px;color:#f0a8cf}.note{font-size:12px;color:#c4cad3;background:#101620;border:1px solid #273244;border-radius:10px;padding:10px 12px;line-height:1.7;margin-bottom:12px}label{display:block;font-size:12px;font-weight:700;color:#b9c0ca;margin:12px 0 6px}input,select{width:100%;border:1px solid #394355;border-radius:9px;background:#101620;color:white;padding:10px 11px;font-size:14px;outline:none}input:focus,select:focus{border-color:#29A6A7}input.bad{border-color:#FD4537;background:#241415}.row2{display:grid;grid-template-columns:1fr 140px;gap:10px}.preview-wrap{min-height:520px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(45deg,#222832 25%,transparent 25%),linear-gradient(-45deg,#222832 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#222832 75%),linear-gradient(-45deg,transparent 75%,#222832 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;border-radius:14px;overflow:hidden;padding:32px 18px}canvas{width:min(100%,980px);height:auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.26))}.status{min-height:22px;margin-top:12px;font-size:12px;color:#8fd4c8;line-height:1.6}.status.error{color:#ff7770}.buttons{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer;background:#29A6A7;color:white}button.secondary{background:#30394a}button.orange{background:#cf7a17}button.small{padding:8px 10px;font-size:12px}.mini{margin-top:14px;padding:12px;border-radius:10px;background:#101620;color:#aeb7c3;font-size:12px;line-height:1.7}.lock{color:#ffcf6d}.oktag{display:inline-block;padding:2px 8px;border-radius:999px;background:#14312e;color:#8fd4c8;font-size:11px;margin-left:6px}.listbox{border:1px solid #273244;background:#101620;border-radius:12px;padding:10px;margin-top:10px}.item{border:1px solid #2c3545;border-radius:10px;padding:10px;margin-bottom:10px;background:#121925}.item:last-child{margin-bottom:0}.item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:#dce3ed;font-size:12px;font-weight:800}.dim{color:#8f99a8;font-size:11px}@media(max-width:1020px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<h1>O-Ne 移動卡生成器 <span style="font-size:12px;color:#8c96a5">V1.0.4</span></h1>
<div class="sub">依正式移動卡 721×126 幾何鎖定。可增減站點、每段切換實線／虛線，輸出白色版／橘色版透明 PNG。</div>
<div class="grid">
<div class="panel">
<div class="section-title">01｜內容輸入</div>
<div class="note">站點至少 2 站、最多 8 站。路段會自動跟著站點數調整。跨國移動直接將指定路段切成虛線。</div>
<label>預覽狀態</label><select id="previewState"><option value="white">WHITE｜白色版預覽</option><option value="orange">ORANGE｜橘色版預覽</option></select>
<label>標題</label><input id="title" value="關西國際機場(KIX) → 北浜">
<div class="buttons"><button id="addStation" class="small">＋ 增加站點</button><button id="removeStation" class="small secondary">－ 刪除最後站點</button></div>
<div class="listbox"><div class="item-head"><div>站點與路段設定</div><div class="dim">站點數：<span id="countBadge">4</span></div></div><div id="stationList"></div></div>
<div id="status" class="status">READY｜可輸出 <span class="oktag">V1.0.4</span></div>
<div class="buttons"><button id="downloadWhite">輸出白色版 PNG</button><button id="downloadOrange" class="orange">輸出橘色版 PNG</button><button id="downloadBoth" class="secondary">一次輸出兩版</button><button id="jsonBtn" class="secondary">輸出欄位 JSON</button><button id="reset" class="secondary">回復示例</button></div>
<div class="mini"><b class="lock">🔒 固定：</b>卡體、切角、白框、左藍條、MOVE 標籤、正式尺寸、透明背景。<br><b>可改：</b>標題、站點、路段、實／虛線、白／橘狀態。</div>
</div>
<div class="panel"><div class="section-title">02｜正式母版即時預覽</div><div class="preview-wrap"><canvas id="c" width="721" height="126"></canvas></div></div>
</div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const C={cream:'#FDF3E7',white:'#FFFFFF',orange:'#FFBE37',blue:'#3F8FB7',brown:'rgba(31,23,19,.80)',border:'rgba(255,255,255,.80)'};
const defaults={previewState:'white',title:'關西國際機場(KIX) → 北浜',stations:['關西國際機場(KIX)','關西空港站','天下茶屋','北浜'],segments:[{name:'走這條路',style:'solid'},{name:'南海電鐵',style:'solid'},{name:'堺筋線',style:'solid'}]};
let data=JSON.parse(JSON.stringify(defaults));
function font(weight,px){return `${weight} ${px}px "Noto Sans TC","Microsoft JhengHei",sans-serif`}
function fitText(text,maxWidth,startSize,minSize,weight=700){let s=startSize;while(s>=minSize){ctx.font=font(weight,s);const w=ctx.measureText(text).width;if(w<=maxWidth)return{size:s,width:w,ok:true};s--}ctx.font=font(weight,minSize);return{size:minSize,width:ctx.measureText(text).width,ok:false}}
function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function drawFormalBase(){ctx.save();ctx.beginPath();ctx.moveTo(20,1.5);ctx.lineTo(700,1.5);ctx.lineTo(719.5,21);ctx.lineTo(719.5,105);ctx.lineTo(700,124.5);ctx.lineTo(20,124.5);ctx.lineTo(1.5,106);ctx.lineTo(1.5,20);ctx.closePath();ctx.fillStyle=C.brown;ctx.fill();ctx.strokeStyle=C.border;ctx.lineWidth=3;ctx.stroke();ctx.fillStyle=C.blue;ctx.fillRect(3,20,9,86);roundedRect(29,18,141,33,7);ctx.fillStyle=C.blue;ctx.fill();ctx.fillStyle=C.white;ctx.font=font(800,22);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('MOVE',99.5,34.5);ctx.restore()}
function getNodeXs(n){const a=53,b=652;if(n===1)return[a];const step=(b-a)/(n-1);return Array.from({length:n},(_,i)=>a+i*step)}
function drawSegment(x1,x2,y,style,color){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=7;ctx.lineCap='round';ctx.setLineDash(style==='dashed'?[12,9]:[]);ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();ctx.restore()}
function drawCenteredText(text,x,y,maxW,start,min,color,weight=700){const f=fitText(text,maxW,start,min,weight);ctx.font=font(weight,f.size);ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText(text,x,y);return !f.ok}
function drawStationText(text,nodeX,nextX,y,last,color){const safeRight=682,maxW=last?Math.max(42,safeRight-nodeX):Math.max(42,nextX-nodeX-12);const f=fitText(text,maxW,13,8,700);let x=nodeX;if(x+f.width>safeRight)x=safeRight-f.width;ctx.font=font(700,f.size);ctx.fillStyle=color;ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText(text,x,y);return !f.ok}
function renderForm(){const n=data.stations.length;$('countBadge').textContent=n;const box=$('stationList');box.innerHTML='';data.stations.forEach((station,i)=>{const wrap=document.createElement('div');wrap.className='item';const role=i===0?'起點':i===n-1?'終點':'中繼點';let h=`<div class="item-head"><div>站點 ${i+1}</div><div class="dim">${role}</div></div><label style="margin-top:0">站點名稱</label><input data-kind="station" data-index="${i}" value="${station.replace(/"/g,'&quot;')}">`;if(i<n-1){const seg=data.segments[i]||{name:'',style:'solid'};h+=`<div class="row2"><div><label>路段名稱</label><input data-kind="segment-name" data-index="${i}" value="${(seg.name||'').replace(/"/g,'&quot;')}"></div><div><label>線型</label><select data-kind="segment-style" data-index="${i}"><option value="solid" ${seg.style==='solid'?'selected':''}>實線</option><option value="dashed" ${seg.style==='dashed'?'selected':''}>虛線</option></select></div></div>`}wrap.innerHTML=h;box.appendChild(wrap)});box.querySelectorAll('input,select').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',e=>{const i=+e.target.dataset.index,k=e.target.dataset.kind;if(k==='station')data.stations[i]=e.target.value;if(k==='segment-name')data.segments[i].name=e.target.value;if(k==='segment-style')data.segments[i].style=e.target.value;render()}))}
function render(stateOverride=null){const state=stateOverride||$('previewState').value,color=state==='orange'?C.orange:C.white;ctx.clearRect(0,0,721,126);drawFormalBase();let blocked=false;const tf=fitText($('title').value,353,26,15,800);$('title').classList.toggle('bad',!tf.ok);ctx.font=font(800,tf.size);ctx.fillStyle=C.cream;ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText($('title').value,179,48);blocked|=!tf.ok;const xs=getNodeXs(data.stations.length),routeY=85;for(let i=0;i<xs.length-1;i++)drawSegment(xs[i],xs[i+1],routeY,data.segments[i]?.style||'solid',color);ctx.fillStyle=color;xs.forEach(x=>{ctx.beginPath();ctx.arc(x,routeY,8,0,Math.PI*2);ctx.fill()});for(let i=0;i<xs.length-1;i++){const mid=(xs[i]+xs[i+1])/2,maxW=Math.max(60,(xs[i+1]-xs[i])-20);blocked=drawCenteredText(data.segments[i]?.name||'',mid,75,maxW,14,9,color,700)||blocked}for(let i=0;i<xs.length;i++)blocked=drawStationText(data.stations[i],xs[i],xs[i+1]??682,114,i===xs.length-1,color)||blocked;const st=$('status');document.querySelectorAll('#downloadWhite,#downloadOrange,#downloadBoth').forEach(b=>b.disabled=blocked);st.className=blocked?'status error':'status';st.innerHTML=blocked?'BLOCKED｜有文字超出安全區，請縮短 <span class="oktag">V1.0.4</span>':'READY｜可輸出白色版／橘色版 <span class="oktag">V1.0.4</span>';return blocked}
function addStation(){if(data.stations.length>=8)return;data.stations.push('新站點');data.segments.push({name:'交通方式',style:'solid'});renderForm();render()}
function removeStation(){if(data.stations.length<=2)return;data.stations.pop();data.segments.pop();renderForm();render()}
function downloadState(state,name){if(render(state))return;const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=name;a.click();render()}
$('previewState').onchange=()=>render();$('title').oninput=()=>render();$('addStation').onclick=addStation;$('removeStation').onclick=removeStation;$('downloadWhite').onclick=()=>downloadState('white','O-Ne_NAV-01_MOVE_WHITE.png');$('downloadOrange').onclick=()=>downloadState('orange','O-Ne_NAV-01_MOVE_ORANGE.png');$('downloadBoth').onclick=()=>{if(render('white'))return;downloadState('white','O-Ne_NAV-01_MOVE_WHITE.png');setTimeout(()=>downloadState('orange','O-Ne_NAV-01_MOVE_ORANGE.png'),250)};$('jsonBtn').onclick=()=>{const p={template_id:'1KpEX-97ObOHxLxbnLmK-3lxlVlBsvCPA',component_id:'NAV-01',title:$('title').value,state:$('previewState').value,stations:data.stations,segments:data.segments};const u=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='O-Ne_MOVE_data_v104.json';a.click();URL.revokeObjectURL(u)};$('reset').onclick=()=>{data=JSON.parse(JSON.stringify(defaults));$('previewState').value='white';$('title').value=defaults.title;renderForm();render()};renderForm();render();
</script>
</body>
</html>
