<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>O-Ne 移動卡生成器 V1.0.7</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0e1117;color:#f3efe8;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.app{max-width:1380px;margin:auto;padding:26px}h1{margin:0 0 8px;font-size:24px}.sub{color:#9ea7b3;font-size:13px;margin-bottom:22px;line-height:1.7}.grid{display:grid;grid-template-columns:470px 1fr;gap:22px;align-items:start}.panel{background:#151a23;border:1px solid #2a3240;border-radius:16px;padding:18px;box-shadow:0 12px 30px rgba(0,0,0,.25)}.section-title{font-size:14px;font-weight:800;margin:0 0 12px;color:#f0a8cf}.note{font-size:12px;color:#c4cad3;background:#101620;border:1px solid #273244;border-radius:10px;padding:10px 12px;line-height:1.7;margin-bottom:12px}label{display:block;font-size:12px;font-weight:700;color:#b9c0ca;margin:12px 0 6px}input,select{width:100%;border:1px solid #394355;border-radius:9px;background:#101620;color:white;padding:10px 11px;font-size:14px;outline:none}input:focus,select:focus{border-color:#29A6A7}input.bad{border-color:#FD4537;background:#241415}.row2{display:grid;grid-template-columns:1fr 140px;gap:10px}.preview-wrap{min-height:520px;display:flex;justify-content:center;align-items:center;background:linear-gradient(45deg,#222832 25%,transparent 25%),linear-gradient(-45deg,#222832 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#222832 75%),linear-gradient(-45deg,transparent 75%,#222832 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;border-radius:14px;padding:32px 18px}.preview-wrap canvas{width:min(100%,980px);height:auto}.status{min-height:22px;margin-top:12px;font-size:12px;color:#8fd4c8}.status.error{color:#ff7770}.buttons{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer;background:#29A6A7;color:#fff}button.secondary{background:#30394a}button.orange{background:#cf7a17}button.small{padding:8px 10px;font-size:12px}.listbox{border:1px solid #273244;background:#101620;border-radius:12px;padding:10px;margin-top:10px}.item{border:1px solid #2c3545;border-radius:10px;padding:10px;margin-bottom:10px;background:#121925}.item:last-child{margin-bottom:0}.item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:#dce3ed;font-size:12px;font-weight:800}.dim{color:#8f99a8;font-size:11px}@media(max-width:1020px){.grid{grid-template-columns:1fr}}</style></head><body>
<div class="app"><a class="tool-home-link" href="./" style="min-width:118px;height:44px;display:inline-flex;align-items:center;color:#53ced0;font-size:14px;font-weight:800;text-decoration:none">回工具入口</a><h1>O-Ne 移動卡生成器 <span style="font-size:12px;color:#8c96a5">V1.0.7</span></h1><div class="sub">主底板 #1F1713 固定 80% 透明；白框、MOVE、藍條、文字與節點維持實色。</div><div class="grid"><div class="panel"><div class="section-title">01｜內容輸入</div><div class="note">站點 2～8 站；可增減。每段可切實線／虛線，並輸出白色版／橘色版。</div><label>預覽狀態</label><select id="previewState"><option value="white">WHITE｜白色版</option><option value="orange">ORANGE｜橘色版</option></select><label>標題</label><input id="title" value="關西國際機場(KIX) → 北浜"><div class="buttons"><button id="addStation" class="small">＋ 增加站點</button><button id="removeStation" class="small secondary">－ 刪除最後站點</button></div><div class="listbox"><div class="item-head"><div>站點與路段設定</div><div class="dim">站點數：<span id="countBadge">4</span></div></div><div id="stationList"></div></div><div id="status" class="status">READY｜可輸出</div><div class="buttons"><button id="downloadWhite">輸出白色版 PNG</button><button id="downloadOrange" class="orange">輸出橘色版 PNG</button><button id="downloadBoth" class="secondary">一次輸出兩版</button><button id="jsonBtn" class="secondary">輸出欄位 JSON</button><button id="reset" class="secondary">回復示例</button></div></div><div class="panel"><div class="section-title">02｜正式母版即時預覽</div><div class="preview-wrap"><canvas id="c" width="721" height="126"></canvas></div></div></div></div>
<script src="./edit-backup-v1.js?v=120"></script>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
const C={cream:'#FDF3E7',white:'#FFFFFF',orange:'#FFBE37',blue:'#3F8FB7',brown:'rgba(31,23,19,.80)'};
const defaults={previewState:'white',title:'關西國際機場(KIX) → 北浜',stations:['關西國際機場(KIX)','關西空港站','天下茶屋','北浜'],segments:[{name:'走這條路',style:'solid'},{name:'南海電鐵',style:'solid'},{name:'堺筋線',style:'solid'}]};let data=JSON.parse(JSON.stringify(defaults));
function font(w,s){return `${w} ${s}px "Noto Sans TC","Microsoft JhengHei",sans-serif`}function fitText(t,m,s,n,w=700){while(s>=n){ctx.font=font(w,s);let x=ctx.measureText(t).width;if(x<=m)return{size:s,width:x,ok:true};s--}ctx.font=font(w,n);return{size:n,width:ctx.measureText(t).width,ok:false}}
function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawBase(){ctx.save();ctx.beginPath();ctx.moveTo(20,1.5);ctx.lineTo(700,1.5);ctx.lineTo(719.5,21);ctx.lineTo(719.5,105);ctx.lineTo(700,124.5);ctx.lineTo(20,124.5);ctx.lineTo(1.5,106);ctx.lineTo(1.5,20);ctx.closePath();ctx.fillStyle=C.brown;ctx.fill();ctx.strokeStyle=C.white;ctx.lineWidth=3;ctx.stroke();ctx.fillStyle=C.blue;ctx.fillRect(3,20,9,86);roundedRect(29,18,141,33,7);ctx.fillStyle=C.blue;ctx.fill();ctx.fillStyle=C.white;ctx.font=font(800,22);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('MOVE',99.5,34.5);ctx.restore()}
function xs(n){let a=53,b=652,step=(b-a)/(n-1);return Array.from({length:n},(_,i)=>a+i*step)}
function drawSeg(a,b,y,style,color){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=7;ctx.lineCap='round';ctx.setLineDash(style==='dashed'?[12,9]:[]);ctx.beginPath();ctx.moveTo(a,y);ctx.lineTo(b,y);ctx.stroke();ctx.restore()}
function renderForm(){let n=data.stations.length;$('countBadge').textContent=n;let box=$('stationList');box.innerHTML='';data.stations.forEach((s,i)=>{let e=document.createElement('div');e.className='item';let role=i===0?'起點':i===n-1?'終點':'中繼點';let h=`<div class="item-head"><div>站點 ${i+1}</div><div class="dim">${role}</div></div><label style="margin-top:0">站點名稱</label><input data-k="station" data-i="${i}" value="${s.replace(/"/g,'&quot;')}">`;if(i<n-1){let g=data.segments[i];h+=`<div class="row2"><div><label>路段名稱</label><input data-k="name" data-i="${i}" value="${g.name.replace(/"/g,'&quot;')}"></div><div><label>線型</label><select data-k="style" data-i="${i}"><option value="solid" ${g.style==='solid'?'selected':''}>實線</option><option value="dashed" ${g.style==='dashed'?'selected':''}>虛線</option></select></div></div>`}e.innerHTML=h;box.appendChild(e)});box.querySelectorAll('input,select').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',ev=>{let i=+ev.target.dataset.i,k=ev.target.dataset.k;if(k==='station')data.stations[i]=ev.target.value;if(k==='name')data.segments[i].name=ev.target.value;if(k==='style')data.segments[i].style=ev.target.value;render()}))}
function render(stateOverride=null){let state=stateOverride||$('previewState').value,color=state==='orange'?C.orange:C.white;ctx.clearRect(0,0,721,126);drawBase();let blocked=false,tf=fitText($('title').value,353,26,15,800);ctx.font=font(800,tf.size);ctx.fillStyle=C.cream;ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText($('title').value,179,48);blocked||=!tf.ok;let X=xs(data.stations.length),y=85;for(let i=0;i<X.length-1;i++)drawSeg(X[i],X[i+1],y,data.segments[i].style,color);ctx.fillStyle=color;X.forEach(x=>{ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill()});for(let i=0;i<X.length-1;i++){let mid=(X[i]+X[i+1])/2,f=fitText(data.segments[i].name,Math.max(60,X[i+1]-X[i]-20),14,9,700);ctx.font=font(700,f.size);ctx.textAlign='center';ctx.fillStyle=color;ctx.fillText(data.segments[i].name,mid,75);blocked||=!f.ok}for(let i=0;i<X.length;i++){let last=i===X.length-1,max=Math.max(42,last?X[i]-X[i-1]-12:X[i+1]-X[i]-12),f=fitText(data.stations[i],max,13,8,700),x=last?682:X[i];if(!last&&x+f.width>682)x=682-f.width;ctx.font=font(700,f.size);ctx.textAlign=last?'right':'left';ctx.fillStyle=color;ctx.fillText(data.stations[i],x,114);blocked||=!f.ok}$('status').className=blocked?'status error':'status';$('status').textContent=blocked?'BLOCKED｜有文字超出安全區':'READY｜可輸出';return blocked}
$('previewState').onchange=render;$('title').oninput=render;$('addStation').onclick=()=>{if(data.stations.length<8){data.stations.push('新站點');data.segments.push({name:'交通方式',style:'solid'});renderForm();render()}};$('removeStation').onclick=()=>{if(data.stations.length>2){data.stations.pop();data.segments.pop();renderForm();render()}};
function dl(s,n){if(render(s))return;let a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=n;a.click();render()}$('downloadWhite').onclick=()=>dl('white','O-Ne_NAV-01_MOVE_WHITE.png');$('downloadOrange').onclick=()=>dl('orange','O-Ne_NAV-01_MOVE_ORANGE.png');$('downloadBoth').onclick=()=>{dl('white','O-Ne_NAV-01_MOVE_WHITE.png');setTimeout(()=>dl('orange','O-Ne_NAV-01_MOVE_ORANGE.png'),250)};$('jsonBtn').onclick=()=>{let p={component_id:'NAV-01',generator_version:'V1.0.7_20260826',panel_fill_opacity:.8,title:$('title').value,state:$('previewState').value,stations:data.stations,segments:data.segments};let u=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='O-Ne_MOVE_data_v107.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('reset').onclick=()=>{data=JSON.parse(JSON.stringify(defaults));$('previewState').value='white';$('title').value=defaults.title;renderForm();render()};renderForm();render();
function validateMove(snapshot){
  if(!snapshot||!['white','orange'].includes(snapshot.previewState))throw new Error('預覽狀態無效。');
  if(!snapshot.data||!Array.isArray(snapshot.data.stations)||!Array.isArray(snapshot.data.segments)||snapshot.data.stations.length<2||snapshot.data.stations.length>8||snapshot.data.segments.length!==snapshot.data.stations.length-1)throw new Error('站點須為 2～8 站，且每站之間都要有路段。');
  snapshot.data.segments.forEach(segment=>{if(!segment||!['solid','dashed'].includes(segment.style))throw new Error('路段線型必須是 solid 或 dashed。')});
  return snapshot;
}
ONEEditBackup.mount({
  id:'move-card',generatorVersion:'V1.0.7_20260826',anchor:document.querySelectorAll('.buttons')[1],
  capture:()=>({previewState:$('previewState').value,title:$('title').value,data:JSON.parse(JSON.stringify(data))}),
  apply:snapshot=>{snapshot=validateMove(snapshot);data=JSON.parse(JSON.stringify(snapshot.data));$('previewState').value=snapshot.previewState;$('title').value=String(snapshot.title??'');renderForm();render()},
  fromJSON:payload=>{if(!payload||payload.component_id!=='NAV-01')throw new Error('component_id 必須是 NAV-01。');return validateMove({previewState:payload.state,title:String(payload.title??''),data:{stations:payload.stations,segments:payload.segments}})}
});
</script></body></html>
