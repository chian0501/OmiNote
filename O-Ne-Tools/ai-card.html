<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O-Ne AI 字卡助手 V1.3</title>
<link rel="stylesheet" href="./one-tools-ui-v1.css?v=1310">
<style>
*{box-sizing:border-box}:root{--bg:#0e1117;--panel:#151a23;--panel2:#101620;--border:#2f3948;--text:#f5efe7;--muted:#aeb8c5;--teal:#29A6A7;--pink:#f0a8cf;--good:#8fd4c8;--bad:#ff8d86;--purple:#70518a}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.top{min-height:68px;display:flex;align-items:center;gap:14px;padding:11px 18px;border-bottom:1px solid var(--border);background:#111720}.top a{color:#c6d2df;text-decoration:none;font-size:14px;font-weight:800}.top h1{font-size:18px;margin:0}.pill{padding:4px 9px;border-radius:999px;background:#14312e;color:#8fd4c8;font-size:11px;font-weight:900}.spacer{flex:1}.tool-picker{display:flex;align-items:center;gap:8px}.tool-picker label{font-size:13px;color:var(--muted);font-weight:800}.tool-picker select{min-width:155px}.layout{display:grid;grid-template-columns:minmax(390px,450px) minmax(0,1fr);min-height:calc(100vh - 68px)}.bridge{padding:18px;border-right:1px solid var(--border);background:#121821;overflow:auto}.editor iframe{width:100%;height:calc(100vh - 68px);border:0;background:#0e1117;display:block}.intro{margin:0 0 14px;color:#c4ccd6;font-size:14px;line-height:1.7}.box{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:16px;margin-bottom:14px}.box h2{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--pink);margin:0 0 8px}.hint{font-size:14px;line-height:1.65;color:#bdc7d3}.step{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#2a2331;color:#eccbf0;font-size:12px;font-weight:900}label.field-label{display:block;font-size:14px;font-weight:800;color:#d1d7df;margin:13px 0 7px}textarea,select{width:100%;background:var(--panel2);color:white;border:1px solid #445066;border-radius:9px;padding:10px 11px;font:inherit;outline:none}textarea{min-height:118px;resize:vertical;font-size:14px;line-height:1.55}.promptout{min-height:210px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}button,a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:43px;border:0;border-radius:9px;padding:9px 13px;font-weight:900;cursor:pointer;background:var(--teal);color:white;text-decoration:none;font-size:14px}.secondary{background:#30394a!important}.purple{background:var(--purple)!important}.ghost{background:#222a36!important;color:#d1d8e1!important}.status{font-size:13px;line-height:1.6;color:var(--good);min-height:21px;margin-top:9px}.status.bad{color:var(--bad)}details{margin-top:12px;border-top:1px solid #303a49;padding-top:10px}summary{cursor:pointer;color:#c3ccd7;font-size:13px;font-weight:800}pre{white-space:pre-wrap;word-break:break-word;background:#0c1118;border-radius:8px;padding:11px;color:#c8d3de;font-size:12px;max-height:300px;overflow:auto}
@media(max-width:980px){.layout{grid-template-columns:1fr}.bridge{border-right:0;border-bottom:1px solid var(--border)}.editor iframe{height:78vh}.top{flex-wrap:wrap}.spacer{display:none}.tool-picker{width:100%}.tool-picker select{flex:1}}@media(max-width:560px){.bridge{padding:13px}.top{padding:11px 14px}.buttons{display:grid;grid-template-columns:1fr}.buttons>*{width:100%}}
</style>
<script src="./one-tools-ui-v1.js?v=1310"></script>
</head>
<body>
<header class="top">
  <a href="./">← 回工具入口</a>
  <h1>O-Ne AI 字卡助手</h1><span class="pill">V1.3</span>
  <div class="spacer"></div>
  <div class="tool-picker"><label for="toolSelect">目前卡型</label><select id="toolSelect"></select></div>
  <a id="rawLink" href="#" target="_blank" rel="noopener">另開完整編輯器 ↗</a>
</header>
<div class="layout">
  <aside class="bridge">
    <p class="intro">這裡只幫你把想法整理成工具能讀的 JSON；卡片版型與正式視覺仍由右側原工具負責。</p>
    <section class="box">
      <h2><span class="step">1</span>描述你要表達的內容</h2>
      <div class="hint">用自己的話寫即可，不需要先懂 JSON。</div>
      <label class="field-label" for="intent">內容描述</label>
      <textarea id="intent" placeholder="例如：下雨所以臨時不去大阪城，改去大阪今昔館。"></textarea>
      <div class="buttons"><button id="generatePrompt">產生完整 AI 指令</button><button id="fillExample" class="ghost">放入示例</button></div>
      <div id="generateStatus" class="status" aria-live="polite"></div>
    </section>
    <section class="box">
      <h2><span class="step">2</span>複製指令交給 ChatGPT</h2>
      <div class="hint">複製後貼到 ChatGPT；它只應回傳一個 JSON 物件。</div>
      <label class="field-label" for="promptOutput">完整 AI 指令</label>
      <textarea id="promptOutput" class="promptout" placeholder="完成步驟 1 後會出現在這裡" readonly></textarea>
      <div class="buttons"><button id="copyPrompt">複製指令</button><a class="btn purple" href="https://chatgpt.com/" target="_blank" rel="noopener">開啟 ChatGPT ↗</a></div>
      <div id="copyStatus" class="status" aria-live="polite"></div>
    </section>
    <section class="box">
      <h2><span class="step">3</span>把 JSON 套回右側工具</h2>
      <div class="hint">貼上 ChatGPT 回傳的完整 JSON，再按套用；套用後仍可在右側手動微調。</div>
      <label class="field-label" for="jsonInput">ChatGPT 回傳 JSON</label>
      <textarea id="jsonInput" placeholder='例如：{"tool":"trigger-card","state":"EVENT",...}'></textarea>
      <div class="buttons"><button id="applyJson">套用到右側工具</button><button id="clearJson" class="secondary">清空</button></div>
      <div id="applyStatus" class="status" aria-live="polite"></div>
      <details><summary>查看這張卡的 JSON 格式</summary><pre id="schemaView"></pre></details>
    </section>
  </aside>
  <main class="editor"><iframe id="toolFrame" title="O-Ne 原始字卡編輯器"></iframe></main>
</div>
<script>
(function(){
  'use strict';
  var tools={
    general:{name:'一般卡',id:'general-card',src:'./general-card.html?v=121&build=ui-shell-v131',example:'我們現在抵達三重站，下一站要去桃園機場第二航廈。',schema:{tool:'general-card',title:'A2 三重站',subtitle:'下一站｜桃園機場第二航廈'}},
    trigger:{name:'觸發卡',id:'trigger-card',src:'./trigger-card.html?v=102&build=ui-shell-v131',example:'我們在關西機場等車，突然看到外面在放煙火。',schema:{tool:'trigger-card',state:'EVENT',title:'機場居然看得到煙火？！',subtitle:'關西機場意外解鎖隱藏事件',progress:'0/1'}},
    persistent:{name:'常駐卡',id:'persistent-card',src:'./persistent-card.html?v=112&build=ui-shell-v131',example:'現在的主線任務是前往大阪城，進度還沒完成。',schema:{tool:'persistent-card',state:'MISSION',task_text:'前往大阪城',progress:'0/1'}},
    move:{name:'移動卡',id:'move-card',src:'./move-card.html?v=107&build=ui-shell-v131',example:'從關西機場搭南海電鐵到天下茶屋，再轉堺筋線到北濱。',schema:{tool:'move-card',title:'關西機場 → 北濱',state:'white',stations:['關西機場','天下茶屋','北濱'],segments:[{name:'南海電鐵',style:'solid'},{name:'堺筋線',style:'solid'}]}},
    choice:{name:'選項卡',id:'choice-card',src:'./choice-card.html?v=101&build=ui-shell-v131',example:'大阪下雨天要選備案，今昔館是首選，其他是海遊館和梅田地下街。',schema:{tool:'choice-card',title:'大阪下雨去哪？',question:'今天選哪個備案？',options:[{text:'大阪今昔館',state:'BRIGHT'},{text:'海遊館',state:'DIM'},{text:'梅田地下街',state:'DIM'}]}}
  };
  var aliases={'general-card':'general','trigger-card':'trigger','persistent-card':'persistent','move-card':'move','choice-card':'choice'};
  var $=function(id){return document.getElementById(id)};
  var query=new URLSearchParams(location.search).get('tool')||'general';
  var current=aliases[query]||query;if(!tools[current])current='general';
  function status(id,message,bad){var node=$(id);node.textContent=message||'';node.className=bad?'status bad':'status'}
  function init(){var select=$('toolSelect');Object.keys(tools).forEach(function(key){var option=document.createElement('option');option.value=key;option.textContent=tools[key].name;select.appendChild(option)});select.value=current;select.onchange=function(){location.href='./ai-card.html?tool='+encodeURIComponent(select.value)+'&v=13'};var tool=tools[current];$('toolFrame').src=tool.src+'&embed=1';$('rawLink').href=tool.src;$('schemaView').textContent=JSON.stringify(tool.schema,null,2);document.title='O-Ne AI 字卡助手｜'+tool.name}
  function promptText(){var tool=tools[current],intent=$('intent').value.trim()||'(尚未輸入描述)';return '你是 O-Ne 字卡 AI 助手。請使用繁體中文。\n\n目前使用者正在「'+tool.name+'」編輯器。你只能整理既有工具的可編輯內容，不得重新設計 UI、改版型或增加格式外欄位。\n\n請把描述整理成簡短、自然、適合影片字卡的內容。避免流水帳、同義重複與誇張改寫。\n\n重要規則：\n1. 只能回傳一個 JSON 物件。\n2. 不要 Markdown、程式碼框、說明文字或註解。\n3. tool 必須固定為 "'+tool.id+'"。\n4. 不確定的資訊不要自行補事實。\n5. 欄位完全依照下面格式。\n\nJSON 格式範例：\n'+JSON.stringify(tool.schema,null,2)+'\n\n使用者描述：\n'+intent}
  async function copyText(value){try{await navigator.clipboard.writeText(value);return true}catch(error){var area=document.createElement('textarea');area.value=value;document.body.appendChild(area);area.select();var ok=document.execCommand('copy');area.remove();return ok}}
  function parse(raw){var value=String(raw||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim(),start=value.indexOf('{'),end=value.lastIndexOf('}');if(start<0||end<start)throw new Error('找不到 JSON 物件');return JSON.parse(value.slice(start,end+1))}
  function frameDoc(){var doc=$('toolFrame').contentDocument;if(!doc)throw new Error('右側工具尚未載入');return doc}
  function setValue(doc,id,value,eventName){var element=doc.getElementById(id);if(!element)throw new Error('找不到欄位：'+id);element.value=value==null?'':value;element.dispatchEvent(new Event(eventName||'input',{bubbles:true}))}
  function normalizedState(value){return String(value||'').toUpperCase().replace('!','').trim()}
  function verify(payload){if(String(payload.tool||'')!==tools[current].id)throw new Error('卡型不符：目前是 '+tools[current].id+'，貼入的是 '+String(payload.tool||'未指定'))}
  function applyGeneral(payload,doc){setValue(doc,'title',payload.title);setValue(doc,'subtitle',payload.subtitle)}
  function applyTrigger(payload,doc){var stateValue=normalizedState(payload.state);if(['EVENT','DONE','FAIL'].indexOf(stateValue)<0)throw new Error('state 必須是 EVENT、DONE 或 FAIL');setValue(doc,'state',stateValue,'change');setValue(doc,'title',payload.title);setValue(doc,'subtitle',payload.subtitle);setValue(doc,'progress',payload.progress)}
  function applyPersistent(payload,doc){var stateValue=normalizedState(payload.state);if(['MISSION','DONE','FAIL'].indexOf(stateValue)<0)throw new Error('state 必須是 MISSION、DONE 或 FAIL');setValue(doc,'state',stateValue,'change');setValue(doc,'task',payload.task_text||payload.task);setValue(doc,'progress',payload.progress)}
  function applyMove(payload,doc){if(!Array.isArray(payload.stations))throw new Error('stations 必須是陣列');var stations=payload.stations.map(function(item){return typeof item==='string'?{name:item}:item});if(stations.length<2||stations.length>8)throw new Error('移動卡站點需 2～8 站');var count=doc.querySelectorAll('#stationList input[data-k="station"]').length;while(count<stations.length){doc.getElementById('addStation').click();count++}while(count>stations.length){doc.getElementById('removeStation').click();count--}setValue(doc,'title',payload.title||'');setValue(doc,'previewState',String(payload.state||'white').toLowerCase()==='orange'?'orange':'white','change');var segments=Array.isArray(payload.segments)?payload.segments:[];stations.forEach(function(station,index){var input=doc.querySelector('#stationList input[data-k="station"][data-i="'+index+'"]');input.value=station.name||'';input.dispatchEvent(new Event('input',{bubbles:true}));if(index<stations.length-1){var segment=segments[index]||{},name=doc.querySelector('#stationList input[data-k="name"][data-i="'+index+'"]'),style=doc.querySelector('#stationList select[data-k="style"][data-i="'+index+'"]');if(name){name.value=segment.name||station.segment||'';name.dispatchEvent(new Event('input',{bubbles:true}))}if(style){style.value=String(segment.style||station.line||'solid').toLowerCase()==='dashed'?'dashed':'solid';style.dispatchEvent(new Event('change',{bubbles:true}))}}})}
  function wantsBright(option){return typeof option.bright==='boolean'?option.bright:String(option.state||'DIM').toUpperCase()==='BRIGHT'}
  function applyChoice(payload,doc){if(!Array.isArray(payload.options)||payload.options.length<1)throw new Error('options 至少要有 1 項');var count=doc.querySelectorAll('#optionList input[data-action="text"]').length;while(count<payload.options.length){doc.getElementById('addOption').click();count++}while(count>payload.options.length){var deletes=doc.querySelectorAll('#optionList button[data-action="delete"]');deletes[deletes.length-1].click();count--}setValue(doc,'title',payload.title||'');setValue(doc,'question',payload.question||'');payload.options.forEach(function(option,index){var input=doc.querySelector('#optionList input[data-action="text"][data-index="'+index+'"]'),toggle=doc.querySelector('#optionList button[data-action="toggle"][data-index="'+index+'"]');if(!input||!toggle)throw new Error('找不到選項 '+(index+1));input.value=option.text||'';input.dispatchEvent(new Event('input',{bubbles:true}));if(toggle.classList.contains('bright')!==wantsBright(option))toggle.click()})}
  function apply(payload){verify(payload);var doc=frameDoc();if(current==='general')applyGeneral(payload,doc);else if(current==='trigger')applyTrigger(payload,doc);else if(current==='persistent')applyPersistent(payload,doc);else if(current==='move')applyMove(payload,doc);else if(current==='choice')applyChoice(payload,doc)}
  $('fillExample').onclick=function(){$('intent').value=tools[current].example};
  $('generatePrompt').onclick=function(){$('promptOutput').value=promptText();status('generateStatus','完整指令已產生，下一步請複製並交給 ChatGPT。',false)};
  $('copyPrompt').onclick=async function(){if(!$('promptOutput').value.trim())$('promptOutput').value=promptText();var ok=await copyText($('promptOutput').value);status('copyStatus',ok?'已複製；現在可以開啟 ChatGPT 貼上。':'複製失敗，請手動選取上方文字。',!ok)};
  $('clearJson').onclick=function(){$('jsonInput').value='';status('applyStatus','',false)};
  $('applyJson').onclick=function(){try{apply(parse($('jsonInput').value));status('applyStatus','已套用到右側工具；請確認預覽後再輸出 PNG。',false)}catch(error){status('applyStatus','無法套用：'+error.message,true)}};
  init();
})();
</script>
</body>
</html>
