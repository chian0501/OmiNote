<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O-Ne AI 字卡助手</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0e1117;--panel:#151a23;--panel2:#101620;--border:#2a3240;--text:#f5efe7;--muted:#9ea7b3;--teal:#29A6A7;--pink:#f0a8cf;--good:#8fd4c8;--bad:#ff7770}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
.top{height:58px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--border);background:#111720;position:sticky;top:0;z-index:5}
.top a{color:#b9c7d7;text-decoration:none;font-size:13px;font-weight:800}.top h1{font-size:16px;margin:0}.top .spacer{flex:1}.top select{width:auto;min-width:150px}
.layout{display:grid;grid-template-columns:390px 1fr;min-height:calc(100vh - 58px)}
.bridge{padding:18px;border-right:1px solid var(--border);background:#121821;overflow:auto}
.editor{min-width:0;background:#0e1117}.editor iframe{width:100%;height:calc(100vh - 58px);border:0;background:#0e1117;display:block}
.box{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:15px;margin-bottom:14px}
.box h2{font-size:15px;color:var(--pink);margin:0 0 8px}.hint{font-size:12px;line-height:1.65;color:#b4becb}.step{font-size:11px;color:#8d98a6;margin-top:8px}
label{display:block;font-size:12px;font-weight:800;color:#bcc5cf;margin:12px 0 6px}
textarea,select{width:100%;background:var(--panel2);color:white;border:1px solid #394355;border-radius:9px;padding:10px 11px;font:inherit;outline:none}
textarea{min-height:105px;resize:vertical;line-height:1.55;font-size:13px}textarea:focus,select:focus{border-color:var(--teal)}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:9px;padding:10px 12px;font-weight:900;cursor:pointer;background:var(--teal);color:white}button.secondary{background:#30394a}button.ghost{background:#222a36;color:#c2ccd8}
.status{font-size:12px;line-height:1.6;color:var(--good);min-height:20px;margin-top:8px}.status.bad{color:var(--bad)}
details{margin-top:10px;border-top:1px solid #273244;padding-top:10px}summary{cursor:pointer;color:#aeb8c5;font-size:12px;font-weight:800}pre{white-space:pre-wrap;word-break:break-word;background:#0c1118;border-radius:8px;padding:10px;color:#b7c2ce;font-size:11px;line-height:1.5;max-height:260px;overflow:auto}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#14312e;color:#8fd4c8;font-size:10px;font-weight:900;margin-left:6px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.bridge{border-right:0;border-bottom:1px solid var(--border)}.editor iframe{height:75vh}.top{flex-wrap:wrap;height:auto;min-height:58px;padding:10px 14px}.top .spacer{display:none}}
</style>
</head>
<body>
<div class="top">
  <a href="./">← 工具入口</a>
  <h1>O-Ne AI 字卡助手 <span class="pill">Pro Bridge V1</span></h1>
  <div class="spacer"></div>
  <select id="toolSelect"></select>
  <a id="rawLink" href="#" target="_blank">開原始編輯器 ↗</a>
</div>
<div class="layout">
  <aside class="bridge">
    <div class="box">
      <h2>✨ AI 幫我整理</h2>
      <div class="hint">不用 API。先描述你想表達的內容，複製給 ChatGPT Pro；ChatGPT 回 JSON 後貼回來，一鍵套入右側正式工具。</div>
      <label>我要表達什麼？</label>
      <textarea id="intent" placeholder="例如：我們下雨所以臨時不去大阪城，改去大阪今昔館。"></textarea>
      <div class="buttons"><button id="copyPrompt">📋 複製給 ChatGPT</button><button id="fillExample" class="ghost">放入示例</button></div>
      <div id="copyStatus" class="status"></div>
    </div>

    <div class="box">
      <h2>📥 貼上 AI 結果</h2>
      <div class="hint">貼上 ChatGPT 回傳的 JSON。可包含 ```json 程式碼框，Bridge 會自動剝掉。</div>
      <label>AI JSON</label>
      <textarea id="jsonInput" placeholder='例如：{"tool":"trigger-card","state":"EVENT",...}'></textarea>
      <div class="buttons"><button id="applyJson">✅ 套用 AI 結果</button><button id="clearJson" class="secondary">清空</button></div>
      <div id="applyStatus" class="status"></div>
      <details><summary>查看這張卡的 JSON 格式</summary><pre id="schemaView"></pre></details>
    </div>

    <div class="box">
      <h2>使用原則</h2>
      <div class="hint">AI 只負責整理文案與欄位，不重畫 UI、不改正式色彩、不改尺寸。套用後仍可在右側手動修改，再輸出 PNG。</div>
    </div>
  </aside>
  <main class="editor"><iframe id="toolFrame" title="O-Ne card editor"></iframe></main>
</div>
<script>
const TOOLS={
 general:{name:'一般卡',id:'general-card',src:'./general-card.html?v=101',exampleIntent:'我們現在抵達三重站，下一站要去桃園機場第二航廈。',schema:{tool:'general-card',title:'A2 三重站',subtitle:'下一站｜桃園機場第二航廈'}},
 trigger:{name:'觸發卡',id:'trigger-card',src:'./trigger-card.html?v=101',exampleIntent:'我們原本只是在關西機場等車，結果突然看到外面在放煙火。',schema:{tool:'trigger-card',state:'EVENT',title:'機場居然看得到煙火？！',subtitle:'關西機場意外解鎖隱藏事件',progress:'0/1'}},
 persistent:{name:'常駐卡',id:'persistent-card',src:'./persistent-card.html?v=102',exampleIntent:'現在的主線任務是前往大阪城，進度還沒完成。',schema:{tool:'persistent-card',state:'MISSION',task_text:'前往大阪城',progress:'0/1'}},
 move:{name:'移動卡',id:'move-card',src:'./move-card.html?v=105',exampleIntent:'從關西機場搭南海電鐵到天下茶屋，再轉堺筋線到北濱。',schema:{tool:'move-card',title:'關西機場 → 北濱',state:'white',stations:['關西機場','天下茶屋','北濱'],segments:[{name:'南海電鐵',style:'solid'},{name:'堺筋線',style:'solid'}]}},
 choice:{name:'選項卡',id:'choice-card',src:'./choice-card.html?v=100',exampleIntent:'大阪下雨天要選備案，今昔館是目前首選，其他是海遊館和梅田地下街。',schema:{tool:'choice-card',title:'大阪下雨去哪？',question:'今天選哪個備案？',options:[{text:'大阪今昔館',state:'BRIGHT'},{text:'海遊館',state:'DIM'},{text:'梅田地下街',state:'DIM'}]}}
};
const ALIASES={'general-card':'general','trigger-card':'trigger','persistent-card':'persistent','move-card':'move','choice-card':'choice'};
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
let current=ALIASES[params.get('tool')]||params.get('tool')||'general';
if(!TOOLS[current])current='general';

function initPicker(){for(const [key,t] of Object.entries(TOOLS)){const o=document.createElement('option');o.value=key;o.textContent=t.name;$('toolSelect').appendChild(o)}$('toolSelect').value=current;$('toolSelect').onchange=()=>{const next=$('toolSelect').value;location.href=`./ai-card.html?tool=${encodeURIComponent(next)}`}}
function loadTool(){const t=TOOLS[current];$('toolFrame').src=t.src;$('rawLink').href=t.src;$('schemaView').textContent=JSON.stringify(t.schema,null,2);document.title=`O-Ne AI 字卡助手｜${t.name}`}
function strictPrompt(){const t=TOOLS[current],intent=$('intent').value.trim();return `你是 O-Ne 字卡 AI 助手。請使用繁體中文。\n\n目前使用者正在「${t.name}」編輯器。你的工作只是在既有正式母版內整理內容，不得重新設計 UI、不得增加 schema 以外的欄位。\n\n請把使用者描述整理成簡短、自然、適合影片字卡的內容。避免流水帳、避免同義重複、避免為了吸睛扭曲原意。文字應盡量短，讓畫面優先。\n\n非常重要：\n1. 只能回傳一個 JSON 物件。\n2. 不要 Markdown，不要 \\`\\`\\`json，不要說明文字。\n3. tool 必須固定為 "${t.id}"。\n4. 不確定的資訊不要自己補事實。\n5. 欄位必須完全符合下方格式。\n\nJSON 格式範例：\n${JSON.stringify(t.schema,null,2)}\n\n使用者描述：\n${intent||'(尚未輸入描述，請依目前用途提供一個可修改的示例)'}\n`}
async function copyText(text){try{await navigator.clipboard.writeText(text);return true}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}}
function setStatus(id,msg,bad=false){const el=$(id);el.textContent=msg;el.className=bad?'status bad':'status'}
function parseJson(raw){let s=raw.trim();s=s.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();const a=s.indexOf('{'),b=s.lastIndexOf('}');if(a<0||b<a)throw new Error('找不到 JSON 物件');return JSON.parse(s.slice(a,b+1))}
function frameDoc(){const f=$('toolFrame');if(!f.contentDocument||f.contentDocument.readyState!=='complete')throw new Error('右側工具還沒載入完成，請等一下再套用');return f.contentDocument}
function setValue(doc,id,val,event='input'){const el=doc.getElementById(id);if(!el)throw new Error(`找不到欄位：${id}`);el.value=val??'';el.dispatchEvent(new Event(event,{bubbles:true}))}
function normalizeState(v){return String(v||'').toUpperCase().replace('!','').trim()}
function verifyTool(p){const want=TOOLS[current].id,got=String(p.tool||'').trim();if(got!==want)throw new Error(`卡型不符：這裡是 ${want}，AI 回傳的是 ${got||'未指定 tool'}`)}

function applyGeneral(p,doc){setValue(doc,'title',p.title);setValue(doc,'subtitle',p.subtitle)}
function applyTrigger(p,doc){const s=normalizeState(p.state);if(!['EVENT','DONE','FAIL'].includes(s))throw new Error('state 必須是 EVENT、DONE 或 FAIL');setValue(doc,'state',s,'change');setValue(doc,'title',p.title);setValue(doc,'subtitle',p.subtitle);setValue(doc,'progress',p.progress??'')}
function applyPersistent(p,doc){const s=normalizeState(p.state);if(!['MISSION','DONE','FAIL'].includes(s))throw new Error('state 必須是 MISSION、DONE 或 FAIL');setValue(doc,'state',s,'change');setValue(doc,'task',p.task_text??p.task);setValue(doc,'progress',p.progress??'')}
function applyMove(p,doc){let stations=p.stations;if(!Array.isArray(stations))throw new Error('stations 必須是陣列');stations=stations.map(x=>typeof x==='string'?{name:x}:x);if(stations.length<2||stations.length>8)throw new Error('移動卡站點需為 2～8 站');let count=doc.querySelectorAll('#stationList input[data-k="station"]').length;while(count<stations.length){doc.getElementById('addStation').click();count++}while(count>stations.length){doc.getElementById('removeStation').click();count--}
 setValue(doc,'title',p.title||'');const state=String(p.state||p.preview_state||'white').toLowerCase();setValue(doc,'previewState',state==='orange'?'orange':'white','change');
 const segs=Array.isArray(p.segments)?p.segments:stations.slice(0,-1).map(x=>({name:x.segment||'',style:x.line||x.style||'solid'}));
 stations.forEach((s,i)=>{const el=doc.querySelector(`#stationList input[data-k="station"][data-i="${i}"]`);if(!el)throw new Error(`找不到站點 ${i+1}`);el.value=s.name||'';el.dispatchEvent(new Event('input',{bubbles:true}));if(i<stations.length-1){const seg=segs[i]||{};const n=doc.querySelector(`#stationList input[data-k="name"][data-i="${i}"]`);const st=doc.querySelector(`#stationList select[data-k="style"][data-i="${i}"]`);if(n){n.value=seg.name||s.segment||'';n.dispatchEvent(new Event('input',{bubbles:true}))}if(st){const style=String(seg.style||seg.line||s.line||'solid').toLowerCase()==='dashed'?'dashed':'solid';st.value=style;st.dispatchEvent(new Event('change',{bubbles:true}))}}})}
function desiredBright(o){if(typeof o.bright==='boolean')return o.bright;return String(o.state||'DIM').toUpperCase()==='BRIGHT'}
function applyChoice(p,doc){if(!Array.isArray(p.options)||p.options.length<1)throw new Error('options 至少要有 1 項');let count=doc.querySelectorAll('[data-action="text"]').length;while(count<p.options.length){doc.getElementById('addOption').click();count++}while(count>p.options.length){const dels=doc.querySelectorAll('[data-action="delete"]');dels[dels.length-1].click();count--}
 setValue(doc,'title',p.title||'');setValue(doc,'question',p.question||'');
 p.options.forEach((o,i)=>{let input=doc.querySelector(`[data-action="text"][data-index="${i}"]`);if(!input)throw new Error(`找不到選項 ${i+1}`);input.value=o.text||'';input.dispatchEvent(new Event('input',{bubbles:true}));let toggle=doc.querySelector(`[data-action="toggle"][data-index="${i}"]`);if(toggle){const cur=toggle.textContent.includes('亮');const want=desiredBright(o);if(cur!==want)toggle.click()}})}
function applyPayload(p){verifyTool(p);const doc=frameDoc();if(current==='general')applyGeneral(p,doc);if(current==='trigger')applyTrigger(p,doc);if(current==='persistent')applyPersistent(p,doc);if(current==='move')applyMove(p,doc);if(current==='choice')applyChoice(p,doc)}

$('copyPrompt').onclick=async()=>{const ok=await copyText(strictPrompt());setStatus('copyStatus',ok?'已複製。回到 ChatGPT 貼上即可。':'複製失敗，請手動選取文字。',!ok)};
$('fillExample').onclick=()=>{$('intent').value=TOOLS[current].exampleIntent;setStatus('copyStatus','已放入示例，可直接按「複製給 ChatGPT」。')};
$('applyJson').onclick=()=>{try{const p=parseJson($('jsonInput').value);applyPayload(p);setStatus('applyStatus','套用完成 ✅ 右側仍可手動微調，再輸出 PNG。')}catch(e){setStatus('applyStatus',`無法套用：${e.message}`,true)}};
$('clearJson').onclick=()=>{$('jsonInput').value='';setStatus('applyStatus','')};
initPicker();loadTool();
</script>
</body>
</html>
