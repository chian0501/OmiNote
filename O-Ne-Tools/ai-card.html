<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O-Ne AI 字卡助手 V1.2</title><style>*{box-sizing:border-box}:root{--bg:#0e1117;--panel:#151a23;--panel2:#101620;--border:#2a3240;--text:#f5efe7;--muted:#9ea7b3;--teal:#29A6A7;--pink:#f0a8cf;--good:#8fd4c8;--bad:#ff7770;--purple:#70518a}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.top{min-height:58px;display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--border);background:#111720}.top a{color:#b9c7d7;text-decoration:none;font-size:13px;font-weight:800}.top h1{font-size:16px;margin:0}.spacer{flex:1}.top select{width:auto;min-width:150px}.layout{display:grid;grid-template-columns:410px 1fr;min-height:calc(100vh - 58px)}.bridge{padding:18px;border-right:1px solid var(--border);background:#121821;overflow:auto}.editor iframe{width:100%;height:calc(100vh - 58px);border:0;background:#0e1117;display:block}.box{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:15px;margin-bottom:14px}.box h2{font-size:15px;color:var(--pink);margin:0 0 8px}.hint{font-size:12px;line-height:1.65;color:#b4becb}.step{display:inline-block;margin-right:6px;padding:2px 7px;border-radius:999px;background:#2a2331;color:#eccbf0;font-size:10px;font-weight:900}label{display:block;font-size:12px;font-weight:800;color:#bcc5cf;margin:12px 0 6px}textarea,select{width:100%;background:var(--panel2);color:white;border:1px solid #394355;border-radius:9px;padding:10px 11px;font:inherit;outline:none}textarea{min-height:105px;resize:vertical;font-size:13px;line-height:1.55}.promptout{min-height:180px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button,a.btn{border:0;border-radius:9px;padding:10px 12px;font-weight:900;cursor:pointer;background:var(--teal);color:white;text-decoration:none;font-size:13px}.secondary{background:#30394a!important}.purple{background:var(--purple)!important}.ghost{background:#222a36!important;color:#c2ccd8!important}.status{font-size:12px;line-height:1.6;color:var(--good);min-height:20px;margin-top:8px}.status.bad{color:var(--bad)}details{margin-top:10px;border-top:1px solid #273244;padding-top:10px}summary{cursor:pointer;color:#aeb8c5;font-size:12px;font-weight:800}pre{white-space:pre-wrap;word-break:break-word;background:#0c1118;border-radius:8px;padding:10px;color:#b7c2ce;font-size:11px;max-height:260px;overflow:auto}.pill{padding:2px 8px;border-radius:999px;background:#14312e;color:#8fd4c8;font-size:10px;font-weight:900;margin-left:6px}@media(max-width:900px){.layout{grid-template-columns:1fr}.bridge{border-right:0;border-bottom:1px solid var(--border)}.editor iframe{height:75vh}.top{flex-wrap:wrap}.spacer{display:none}}</style></head><body><div class="top"><a href="./">回工具入口</a><h1>O-Ne AI 字卡助手 <span class="pill">Pro Bridge V1.2</span></h1><div class="spacer"></div><select id="toolSelect"></select><a id="rawLink" href="#" target="_blank" rel="noopener">直接開原始編輯器 ↗</a></div><div class="layout"><aside class="bridge"><div class="box"><h2><span class="step">步驟 1</span>描述你要做的字卡</h2><div class="hint">先用自己的話描述，不需要懂 JSON。</div><label>我要表達什麼？</label><textarea id="intent" placeholder="例如：我們下雨所以臨時不去大阪城，改去大阪今昔館。"></textarea><div class="buttons"><button id="generatePrompt">產生 AI 指令</button><button id="fillExample" class="ghost">放入示例</button></div><div id="generateStatus" class="status"></div></div><div class="box"><h2><span class="step">步驟 2</span>把這段交給 ChatGPT</h2><div class="hint">產生後你會直接看到完整指令。先複製，再按「開啟 ChatGPT」貼上。</div><label>給 ChatGPT 的完整指令</label><textarea id="promptOutput" class="promptout" placeholder="請先完成步驟 1" readonly></textarea><div class="buttons"><button id="copyPrompt">📋 複製指令</button><a class="btn purple" href="https://chatgpt.com/" target="_blank" rel="noopener">↗ 開啟 ChatGPT</a></div><div id="copyStatus" class="status"></div></div><div class="box"><h2><span class="step">步驟 3</span>把 ChatGPT 結果貼回來</h2><div class="hint">ChatGPT 會回一段 JSON。整段複製貼到下面，再按套用。</div><label>ChatGPT 回傳結果</label><textarea id="jsonInput" placeholder='例如：{"tool":"trigger-card","state":"EVENT",...}'></textarea><div class="buttons"><button id="applyJson">✅ 套用到右側工具</button><button id="clearJson" class="secondary">清空</button></div><div id="applyStatus" class="status"></div><details><summary>查看這張卡的 JSON 格式</summary><pre id="schemaView"></pre></details></div><div class="box"><h2>使用原則</h2><div class="hint">AI 只填內容欄位，不改尺寸、版型、顏色與 80% 底板規則。右側仍是原本正式工具。</div></div></aside><main class="editor"><iframe id="toolFrame" title="O-Ne card editor"></iframe></main></div><script>(function(){'use strict';var T={general:{name:'一般卡',id:'general-card',src:'./general-card.html?v=101',ex:'我們現在抵達三重站，下一站要去桃園機場第二航廈。',schema:{tool:'general-card',title:'A2 三重站',subtitle:'下一站｜桃園機場第二航廈'}},trigger:{name:'觸發卡',id:'trigger-card',src:'./trigger-card.html?v=101',ex:'我們原本只是在關西機場等車，結果突然看到外面在放煙火。',schema:{tool:'trigger-card',state:'EVENT',title:'機場居然看得到煙火？！',subtitle:'關西機場意外解鎖隱藏事件',progress:'0/1'}},persistent:{name:'常駐卡',id:'persistent-card',src:'./persistent-card.html?v=110',ex:'現在的主線任務是前往大阪城，進度還沒完成。',schema:{tool:'persistent-card',state:'MISSION',task_text:'前往大阪城',progress:'0/1'}},move:{name:'移動卡',id:'move-card',src:'./move-card.html?v=105',ex:'從關西機場搭南海電鐵到天下茶屋，再轉堺筋線到北濱。',schema:{tool:'move-card',title:'關西機場 → 北濱',state:'white',stations:['關西機場','天下茶屋','北濱'],segments:[{name:'南海電鐵',style:'solid'},{name:'堺筋線',style:'solid'}]}},choice:{name:'選項卡',id:'choice-card',src:'./choice-card.html?v=100',ex:'大阪下雨天要選備案，今昔館是目前首選，其他是海遊館和梅田地下街。',schema:{tool:'choice-card',title:'大阪下雨去哪？',question:'今天選哪個備案？',options:[{text:'大阪今昔館',state:'BRIGHT'},{text:'海遊館',state:'DIM'},{text:'梅田地下街',state:'DIM'}]}}};var A={'general-card':'general','trigger-card':'trigger','persistent-card':'persistent','move-card':'move','choice-card':'choice'};function $(id){return document.getElementById(id)}var q=new URLSearchParams(location.search).get('tool')||'general';var cur=A[q]||q;if(!T[cur])cur='general';function stat(id,msg,bad){var e=$(id);e.textContent=msg;e.className=bad?'status bad':'status'}function init(){var s=$('toolSelect');Object.keys(T).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=T[k].name;s.appendChild(o)});s.value=cur;s.onchange=function(){location.href='./ai-card.html?tool='+encodeURIComponent(s.value)+'&v=12'};var t=T[cur];$('toolFrame').src=t.src;$('rawLink').href=t.src;$('schemaView').textContent=JSON.stringify(t.schema,null,2);document.title='O-Ne AI 字卡助手｜'+t.name}function promptText(){var t=T[cur],intent=$('intent').value.trim()||'(尚未輸入描述)';return '你是 O-Ne 字卡 AI 助手。請使用繁體中文。\n\n目前使用者正在「'+t.name+'」編輯器。你的工作只是在既有正式母版內整理內容，不得重新設計 UI，也不得增加格式以外的欄位。\n\n請把描述整理成簡短、自然、適合影片字卡的內容。避免流水帳、同義重複與誇張改寫。\n\n重要規則：\n1. 只能回傳一個 JSON 物件。\n2. 不要 Markdown、不要程式碼框、不要任何說明文字。\n3. tool 必須固定為 "'+t.id+'"。\n4. 不確定的資訊不要自行補事實。\n5. 欄位完全依照下面格式。\n\nJSON 格式範例：\n'+JSON.stringify(t.schema,null,2)+'\n\n使用者描述：\n'+intent}async function copyText(x){try{await navigator.clipboard.writeText(x);return true}catch(e){var a=document.createElement('textarea');a.value=x;document.body.appendChild(a);a.select();var ok=document.execCommand('copy');a.remove();return ok}}function parse(raw){var s=(raw||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim(),a=s.indexOf('{'),b=s.lastIndexOf('}');if(a<0||b<a)throw new Error('找不到 JSON 物件');return JSON.parse(s.slice(a,b+1))}function frameDoc(){var d=$('toolFrame').contentDocument;if(!d)throw new Error('右側工具尚未載入');return d}function setv(d,id,v,ev){var e=d.getElementById(id);if(!e)throw new Error('找不到欄位：'+id);e.value=v==null?'':v;e.dispatchEvent(new Event(ev||'input',{bubbles:true}))}function norm(v){return String(v||'').toUpperCase().replace('!','').trim()}function verify(p){if(String(p.tool||'')!==T[cur].id)throw new Error('卡型不符：這裡是 '+T[cur].id+'，但貼入的是 '+String(p.tool||'未指定'))}function applyGeneral(p,d){setv(d,'title',p.title);setv(d,'subtitle',p.subtitle)}function applyTrigger(p,d){var s=norm(p.state);if(['EVENT','DONE','FAIL'].indexOf(s)<0)throw new Error('state 必須是 EVENT、DONE 或 FAIL');setv(d,'state',s,'change');setv(d,'title',p.title);setv(d,'subtitle',p.subtitle);setv(d,'progress',p.progress)}function applyPersistent(p,d){var s=norm(p.state);if(['MISSION','DONE','FAIL'].indexOf(s)<0)throw new Error('state 必須是 MISSION、DONE 或 FAIL');setv(d,'state',s,'change');setv(d,'task',p.task_text||p.task);setv(d,'progress',p.progress)}function applyMove(p,d){if(!Array.isArray(p.stations))throw new Error('stations 必須是陣列');var stations=p.stations.map(function(x){return typeof x==='string'?{name:x}:x});if(stations.length<2||stations.length>8)throw new Error('移動卡站點需 2～8 站');var count=d.querySelectorAll('#stationList input[data-k="station"]').length;while(count<stations.length){d.getElementById('addStation').click();count++}while(count>stations.length){d.getElementById('removeStation').click();count--}setv(d,'title',p.title||'');setv(d,'previewState',String(p.state||'white').toLowerCase()==='orange'?'orange':'white','change');var segs=Array.isArray(p.segments)?p.segments:[];stations.forEach(function(s,i){var e=d.querySelector('#stationList input[data-k="station"][data-i="'+i+'"]');e.value=s.name||'';e.dispatchEvent(new Event('input',{bubbles:true}));if(i<stations.length-1){var g=segs[i]||{},n=d.querySelector('#stationList input[data-k="name"][data-i="'+i+'"]'),st=d.querySelector('#stationList select[data-k="style"][data-i="'+i+'"]');if(n){n.value=g.name||s.segment||'';n.dispatchEvent(new Event('input',{bubbles:true}))}if(st){st.value=String(g.style||s.line||'solid').toLowerCase()==='dashed'?'dashed':'solid';st.dispatchEvent(new Event('change',{bubbles:true}))}}})}function wantBright(o){return typeof o.bright==='boolean'?o.bright:String(o.state||'DIM').toUpperCase()==='BRIGHT'}function applyChoice(p,d){if(!Array.isArray(p.options)||p.options.length<1)throw new Error('options 至少要有 1 項');var count=d.querySelectorAll('#optionList input[data-action="text"]').length;while(count<p.options.length){d.getElementById('addOption').click();count++}while(count>p.options.length){var dels=d.querySelectorAll('#optionList button[data-action="delete"]');dels[dels.length-1].click();count--}setv(d,'title',p.title||'');setv(d,'question',p.question||'');p.options.forEach(function(o,i){var inp=d.querySelector('#optionList input[data-action="text"][data-index="'+i+'"]'),tog=d.querySelector('#optionList button[data-action="toggle"][data-index="'+i+'"]');if(!inp||!tog)throw new Error('找不到選項 '+(i+1));inp.value=o.text||'';inp.dispatchEvent(new Event('input',{bubbles:true}));var now=tog.classList.contains('bright');if(now!==wantBright(o))tog.click()})}function apply(p){verify(p);var d=frameDoc();if(cur==='general')applyGeneral(p,d);else if(cur==='trigger')applyTrigger(p,d);else if(cur==='persistent')applyPersistent(p,d);else if(cur==='move')applyMove(p,d);else if(cur==='choice')applyChoice(p,d)}$('fillExample').onclick=function(){$('intent').value=T[cur].ex};$('generatePrompt').onclick=function(){$('promptOutput').value=promptText();stat('generateStatus','已產生完整 AI 指令，下一步請複製並開啟 ChatGPT。',false)};$('copyPrompt').onclick=async function(){if(!$('promptOutput').value.trim()){$('promptOutput').value=promptText()}var ok=await copyText($('promptOutput').value);stat('copyStatus',ok?'✅ 已複製。現在按「開啟 ChatGPT」後貼上即可。':'複製失敗，請直接選取上方文字手動複製。',!ok)};$('clearJson').onclick=function(){$('jsonInput').value='';stat('applyStatus','',false)};$('applyJson').onclick=function(){try{apply(parse($('jsonInput').value));stat('applyStatus','✅ 已套用到右側原工具，可以繼續手動調整並輸出 PNG。',false)}catch(e){stat('applyStatus','無法套用：'+e.message,true)}};init()})();</script></body></html>
