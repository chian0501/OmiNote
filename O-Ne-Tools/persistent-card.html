<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O-Ne 常駐卡生成器 V1.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0e1117;color:#f3efe8;font-family:"Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif}
.app{max-width:1320px;margin:auto;padding:26px}
h1{margin:0 0 8px;font-size:24px}
.sub{color:#9ea7b3;font-size:13px;line-height:1.7;margin-bottom:22px}
.grid{display:grid;grid-template-columns:430px 1fr;gap:22px;align-items:start}
.panel{background:#151a23;border:1px solid #2a3240;border-radius:16px;padding:18px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.section-title{font-size:14px;font-weight:800;margin:0 0 12px;color:#f0a8cf}
.note{font-size:12px;color:#c4cad3;background:#101620;border:1px solid #273244;border-radius:10px;padding:10px 12px;line-height:1.7;margin-bottom:12px}
label{display:block;font-size:12px;font-weight:700;color:#b9c0ca;margin:12px 0 6px}
input,select{width:100%;border:1px solid #394355;border-radius:9px;background:#101620;color:white;padding:10px 11px;font-size:14px;outline:none}
input:focus,select:focus{border-color:#29A6A7}
input.bad{border-color:#FD4537;background:#241415}
.preview-wrap{min-height:420px;display:flex;justify-content:center;align-items:center;background:
linear-gradient(45deg,#222832 25%,transparent 25%),
linear-gradient(-45deg,#222832 25%,transparent 25%),
linear-gradient(45deg,transparent 75%,#222832 75%),
linear-gradient(-45deg,transparent 75%,#222832 75%);
background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;border-radius:14px;overflow:hidden;padding:34px 20px}
canvas{width:min(100%,900px);height:auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.26))}
.buttons{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer;background:#29A6A7;color:white}
button.secondary{background:#30394a}
.status{min-height:22px;margin-top:12px;font-size:12px;color:#8fd4c8;line-height:1.6}
.status.error{color:#ff7770}
.mini{margin-top:14px;padding:12px;border-radius:10px;background:#101620;color:#aeb7c3;font-size:12px;line-height:1.7}
.lock{color:#ffcf6d}
.state-row{display:grid;grid-template-columns:1fr 120px;gap:10px}
@media(max-width:950px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<h1>O-Ne 常駐卡生成器 <span style="font-size:12px;color:#8c96a5">V1.0</span></h1>
<div class="sub">同一工具切換 MISSION／DONE!／FAIL。固定使用正式常駐卡母版、正式標籤與成功／失敗圖示。</div>

<div class="grid">
<div class="panel">
  <div class="section-title">01｜內容輸入</div>
  <div class="note">
    <b>MISSION</b>：任務進行中。<br>
    <b>DONE!</b>：成功狀態，自動出現綠色勾勾，任務文字轉橘色。<br>
    <b>FAIL</b>：失敗狀態，自動出現灰色叉叉。
  </div>

  <label>卡片狀態</label>
  <select id="state">
    <option value="MISSION">MISSION｜任務中</option>
    <option value="DONE">DONE!｜成功</option>
    <option value="FAIL">FAIL｜失敗</option>
  </select>

  <label>任務文字</label>
  <input id="task" value="Osaka Castle｜大阪城任務中任務中">

  <label>進度</label>
  <input id="progress" value="0/1">

  <div id="status" class="status">READY｜可輸出透明 PNG</div>

  <div class="buttons">
    <button id="download">輸出透明 PNG</button>
    <button id="jsonBtn" class="secondary">輸出欄位 JSON</button>
    <button id="reset" class="secondary">回復示例</button>
  </div>

  <div class="mini">
    <b class="lock">🔒 固定不改：</b>卡體、右上切角、透明度、MISSION／DONE!／FAIL 標籤、成功／失敗圖示、正式色彩。<br>
    <b>可改：</b>狀態、任務文字、進度。
  </div>
</div>

<div class="panel">
  <div class="section-title">02｜正式母版即時預覽</div>
  <div class="preview-wrap">
    <canvas id="c" width="634" height="62"></canvas>
  </div>
</div>
</div>
</div>

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
const images = {};
let loaded = 0;

for (const [key,src] of Object.entries(ASSETS)) {
  const img = new Image();
  img.onload = () => { loaded++; if (loaded === Object.keys(ASSETS).length) render(); };
  img.src = src;
  images[key] = img;
}

const defaults = {
  state:'MISSION',
  task:'Osaka Castle｜大阪城任務中任務中',
  progress:'0/1'
};

function font(weight, px) {
  return `${weight} ${px}px "Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif`;
}

function fitText(text, maxWidth, startSize, minSize, weight=800) {
  let size=startSize;
  while(size>=minSize) {
    ctx.font=font(weight,size);
    const width=ctx.measureText(text).width;
    if(width<=maxWidth) return {size,width,ok:true};
    size--;
  }
  ctx.font=font(weight,minSize);
  return {size:minSize,width:ctx.measureText(text).width,ok:false};
}

function render() {
  if (loaded < Object.keys(ASSETS).length) return false;
  const state = $('state').value;
  ctx.clearRect(0,0,634,62);

  // Formal clean panel.
  ctx.drawImage(images.base,0,0,634,62);

  // Formal state badge.
  if (state === 'MISSION') ctx.drawImage(images.mission,8,13,141,33);
  if (state === 'DONE') ctx.drawImage(images.done,11,13,141,33);
  if (state === 'FAIL') ctx.drawImage(images.fail,11,13,141,33);

  // Formal state icons.
  if (state === 'DONE') ctx.drawImage(images.successIcon,543,8,46,46);
  if (state === 'FAIL') ctx.drawImage(images.failIcon,543,8,46,46);

  let blocked=false;

  // Task text.
  const task = $('task').value;
  const taskFit = fitText(task,319,21,14,800);
  $('task').classList.toggle('bad',!taskFit.ok);
  ctx.font=font(800,taskFit.size);
  ctx.fillStyle = state === 'DONE' ? '#FFBE37' : '#FDF3E7';
  ctx.textAlign='left';
  ctx.textBaseline='alphabetic';
  ctx.fillText(task,163,42);
  blocked = blocked || !taskFit.ok;

  // Progress.
  const prog = $('progress').value;
  const progFit = fitText(prog,40,20,14,800);
  $('progress').classList.toggle('bad',!progFit.ok);
  ctx.font=font(800,progFit.size);
  ctx.fillStyle='#FDF3E7';
  ctx.fillText(prog,498,42);
  blocked = blocked || !progFit.ok;

  const status = $('status');
  $('download').disabled = blocked;
  if (blocked) {
    status.textContent='BLOCKED｜任務文字或進度超出正式安全範圍，請縮短內容';
    status.className='status error';
  } else {
    status.textContent='READY｜可輸出透明 PNG';
    status.className='status';
  }
  return blocked;
}

$('state').addEventListener('change',render);
$('task').addEventListener('input',render);
$('progress').addEventListener('input',render);

$('download').onclick = () => {
  if (render()) return;
  const s=$('state').value;
  canvas.toBlob(blob=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`O-Ne_常駐卡_${s}.png`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  },'image/png');
};

$('jsonBtn').onclick = () => {
  const payload={
    component_id:'PERSISTENT-MISSION',
    master_psd_id:'1VMBCecO8QLuwtSMxy-BplfUa2Ybr3YDU',
    state:$('state').value,
    task_text:$('task').value,
    progress:$('progress').value
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='O-Ne_常駐卡_data.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

$('reset').onclick = () => {
  $('state').value=defaults.state;
  $('task').value=defaults.task;
  $('progress').value=defaults.progress;
  render();
};
</script>
</body>
</html>
