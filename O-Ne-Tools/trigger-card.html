<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O-Ne 觸發卡生成器 V1.0.1</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0e1117;color:#f3efe8;font-family:"Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif}
.app{max-width:1320px;margin:auto;padding:26px}h1{margin:0 0 8px;font-size:24px}.sub{color:#9ea7b3;font-size:13px;line-height:1.7;margin-bottom:22px}.grid{display:grid;grid-template-columns:430px 1fr;gap:22px;align-items:start}.panel{background:#151a23;border:1px solid #2a3240;border-radius:16px;padding:18px;box-shadow:0 12px 30px rgba(0,0,0,.25)}.section-title{font-size:14px;font-weight:800;margin:0 0 12px;color:#f0a8cf}.note{font-size:12px;color:#c4cad3;background:#101620;border:1px solid #273244;border-radius:10px;padding:10px 12px;line-height:1.7;margin-bottom:12px}label{display:block;font-size:12px;font-weight:700;color:#b9c0ca;margin:12px 0 6px}input,select{width:100%;border:1px solid #394355;border-radius:9px;background:#101620;color:white;padding:10px 11px;font-size:14px;outline:none}input:focus,select:focus{border-color:#29A6A7}input.bad{border-color:#FD4537;background:#241415}.row2{display:grid;grid-template-columns:1fr 110px;gap:10px}.preview-wrap{min-height:420px;display:flex;justify-content:center;align-items:center;background:linear-gradient(45deg,#222832 25%,transparent 25%),linear-gradient(-45deg,#222832 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#222832 75%),linear-gradient(-45deg,transparent 75%,#222832 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;border-radius:14px;overflow:hidden;padding:34px 20px}canvas{width:min(100%,920px);height:auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.26))}.buttons{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer;background:#29A6A7;color:white}button.secondary{background:#30394a}.status{min-height:22px;margin-top:12px;font-size:12px;color:#8fd4c8;line-height:1.6}.status.error{color:#ff7770}.mini{margin-top:14px;padding:12px;border-radius:10px;background:#101620;color:#aeb7c3;font-size:12px;line-height:1.7}.lock{color:#ffcf6d}@media(max-width:950px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><a class="tool-home-link" href="./" style="min-width:118px;height:44px;display:inline-flex;align-items:center;color:#53ced0;font-size:14px;font-weight:800;text-decoration:none">回工具入口</a>
<h1>O-Ne 觸發卡生成器 <span style="font-size:12px;color:#8c96a5">V1.0.1</span></h1>
<div class="sub">同一工具切換 EVENT／DONE!／FAIL。主底板 80% 透明；外框、色條、標籤、圖示與文字維持實色。</div>
<div class="grid">
<div class="panel">
  <div class="section-title">01｜內容輸入</div>
  <div class="note"><b>EVENT</b>：事件觸發，副標白色。<br><b>DONE!</b>：事件成功，副標轉橘色並出現綠勾。<br><b>FAIL</b>：事件失敗，副標維持白色並出現灰叉。</div>
  <label>卡片狀態</label>
  <select id="state"><option value="EVENT">EVENT｜事件觸發</option><option value="DONE">DONE!｜成功</option><option value="FAIL">FAIL｜失敗</option></select>
  <label>大標｜橘色</label><input id="title" value="在機場看煙火">
  <div class="row2"><div><label>副標／說明</label><input id="subtitle" value="關西國際機場 (KIX) 看到煙火"></div><div><label>進度</label><input id="progress" value="0/1"></div></div>
  <div id="statusText" class="status">READY｜可輸出透明 PNG</div>
  <div class="buttons"><button id="download">輸出透明 PNG</button><button id="jsonBtn" class="secondary">輸出欄位 JSON</button><button id="reset" class="secondary">回復示例</button></div>
  <div class="mini"><b class="lock">🔒 固定不改：</b>卡體、切角、左黃條、EVENT／DONE!／FAIL 標籤、結果圖示、正式色彩。<br><b>可改：</b>狀態、大標、副標、進度。</div>
</div>
<div class="panel"><div class="section-title">02｜正式母版即時預覽</div><div class="preview-wrap"><canvas id="c" width="653" height="127"></canvas></div></div>
</div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);const C={orange:'#FFBE37',cream:'#FDF3E7',dark:'#1F1713',darkText:'#3B170C',fail:'#333333',failText:'#E2E2E2',green:'#21A74D'};const defaults={state:'EVENT',title:'在機場看煙火',subtitle:'關西國際機場 (KIX) 看到煙火',progress:'0/1'};
function font(weight,px){return `${weight} ${px}px "Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif`}
function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function fitText(text,maxWidth,startSize,minSize,weight){let s=startSize;while(s>=minSize){ctx.font=font(weight,s);const w=ctx.measureText(text).width;if(w<=maxWidth)return{size:s,width:w,ok:true};s--}ctx.font=font(weight,minSize);return{size:minSize,width:ctx.measureText(text).width,ok:false}}
function drawBase(){ctx.save();ctx.fillStyle='rgba(31,23,19,.80)';ctx.strokeStyle='#FFFFFF';ctx.lineWidth=4;ctx.lineJoin='miter';ctx.beginPath();ctx.moveTo(21,4);ctx.lineTo(632,4);ctx.lineTo(650,21);ctx.lineTo(650,106);ctx.lineTo(632,123);ctx.lineTo(21,123);ctx.lineTo(4,106);ctx.lineTo(4,21);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle=C.orange;ctx.fillRect(4,20,9,87);ctx.restore()}
function drawLabel(state){const x=30,y=20,w=141,h=33;roundedRect(x,y,w,h,10);ctx.fillStyle=state==='FAIL'?C.fail:C.orange;ctx.fill();ctx.fillStyle=state==='FAIL'?C.failText:C.darkText;ctx.font=font(800,20);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(state==='DONE'?'DONE!':state,x+w/2,y+h/2+1)}
function drawSuccessIcon(){const x=522,y=19,w=90,h=90;roundedRect(x,y,w,h,10);ctx.fillStyle=C.cream;ctx.fill();roundedRect(x+4,y+4,w-8,h-8,7);ctx.fillStyle=C.green;ctx.fill();ctx.strokeStyle=C.cream;ctx.lineWidth=11;ctx.lineCap='square';ctx.lineJoin='miter';ctx.beginPath();ctx.moveTo(x+18,y+45);ctx.lineTo(x+34,y+61);ctx.lineTo(x+71,y+25);ctx.stroke()}
function drawFailIcon(){const x=522,y=19,w=90,h=90;roundedRect(x,y,w,h,10);ctx.fillStyle=C.cream;ctx.fill();roundedRect(x+4,y+4,w-8,h-8,7);ctx.fillStyle=C.fail;ctx.fill();ctx.strokeStyle=C.cream;ctx.lineWidth=11;ctx.lineCap='square';ctx.beginPath();ctx.moveTo(x+25,y+26);ctx.lineTo(x+65,y+66);ctx.moveTo(x+65,y+26);ctx.lineTo(x+25,y+66);ctx.stroke()}
function render(){const state=$('state').value;ctx.clearRect(0,0,653,127);drawBase();drawLabel(state);if(state==='DONE')drawSuccessIcon();if(state==='FAIL')drawFailIcon();let blocked=false;const resultState=state!=='EVENT';const title=$('title').value,titleFit=fitText(title,resultState?320:430,34,18,800);$('title').classList.toggle('bad',!titleFit.ok);ctx.font=font(800,titleFit.size);ctx.fillStyle=C.orange;ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText(title,183,49);blocked=blocked||!titleFit.ok;const subBase=$('subtitle').value.trim(),prog=$('progress').value.trim(),subText=[subBase,prog].filter(Boolean).join(' '),subFit=fitText(subText,resultState?470:585,21,14,700);$('subtitle').classList.toggle('bad',!subFit.ok);$('progress').classList.toggle('bad',!subFit.ok);ctx.font=font(700,subFit.size);ctx.fillStyle=state==='DONE'?C.orange:C.cream;ctx.fillText(subText,34,92);blocked=blocked||!subFit.ok;const st=$('statusText');$('download').disabled=blocked;if(blocked){st.textContent='BLOCKED｜大標或副標超出正式安全範圍，請縮短內容';st.className='status error'}else{st.textContent='READY｜可輸出透明 PNG';st.className='status'}return blocked}
['state','title','subtitle','progress'].forEach(id=>$(id).addEventListener(id==='state'?'change':'input',render));$('download').onclick=()=>{if(render())return;canvas.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`O-Ne_觸發卡_${$('state').value}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')};$('jsonBtn').onclick=()=>{const payload={component_id:'TRIGGER-CARD',master_psd_id:'10sd-QP_W3YqYksm1cVGYhaAqLbppjBJY',generator_version:'V1.0.1_20260807',panel_fill_opacity:.8,state:$('state').value,title:$('title').value,subtitle:$('subtitle').value,progress:$('progress').value};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='O-Ne_觸發卡_data_v101.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('reset').onclick=()=>{$('state').value=defaults.state;$('title').value=defaults.title;$('subtitle').value=defaults.subtitle;$('progress').value=defaults.progress;render()};render();
</script></body></html>
