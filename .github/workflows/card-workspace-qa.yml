name: Card workspace browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'O-Ne-Tools/**'
      - 'package*.json'
      - '.github/workflows/card-workspace-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: card-workspace-qa-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out the approved artwork baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 98d3b0da14d9bc5224b8a3d714ef11279f72e5f6
          path: .workspace-baseline
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium and Traditional Chinese fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Run 12-tool visual and interaction checks
        run: npm run test:workspace:browser
      - name: Preserve screenshots, downloads, traces, and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: card-workspace-qa-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30
          if-no-files-found: error
