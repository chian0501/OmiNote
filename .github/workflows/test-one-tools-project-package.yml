name: Test O-Ne Tools project package

on:
  push:
    branches:
      - fix/one-tools-project-package-image-restore-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shared edit backup regression
        run: node O-Ne-Tools/tests/edit-backup-regression.cjs
      - name: Project package regression
        run: node O-Ne-Tools/tests/project-package-regression.cjs
