<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OmiNote｜入口</title>
  <meta name="description" content="OmiNote 一頁式網站入口。" />
  <style>
    :root{--bg:#eef8ff;--paper:#fff;--ink:#11314b;--muted:#5d7890;--blue:#0795d0;--deep:#0b405f;--line:#d8edf7;--shadow:0 18px 42px rgba(24,83,116,.14)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 0 0,rgba(0,169,220,.18),transparent 32%),radial-gradient(circle at 100% 18%,rgba(255,184,77,.2),transparent 26%),linear-gradient(180deg,#eaf8ff,#fffaf1);min-height:100vh}.wrap{width:min(960px,calc(100% - 32px));margin:auto;padding:48px 0}.hero{color:#fff;border-radius:34px;padding:42px clamp(24px,5vw,58px);background:linear-gradient(135deg,#0b4b6e,#092e48);box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"🗒️";position:absolute;right:38px;top:26px;font-size:58px;filter:drop-shadow(0 8px 0 rgba(0,0,0,.22));transform:rotate(-6deg)}.tag{display:inline-flex;border-radius:999px;padding:7px 13px;background:rgba(42,202,242,.2);color:#b7f2ff;font-weight:900}h1{font-size:clamp(36px,6vw,62px);line-height:1.04;margin:22px 0 14px;letter-spacing:-.04em}.lead{max-width:700px;color:#c4ecff;font-size:clamp(17px,2.2vw,22px);font-weight:850}.section-title{margin:34px 0 14px;color:var(--deep)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{display:block;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:24px;text-decoration:none;color:inherit;transition:.18s transform,.18s box-shadow}.card:hover{transform:translateY(-3px);box-shadow:0 22px 48px rgba(24,83,116,.18);text-decoration:none}.card .emoji{font-size:36px}.card h2{margin:10px 0 8px;color:var(--deep)}.card p{margin:0;color:var(--muted);line-height:1.7}.badge{display:inline-flex;margin-top:18px;border-radius:999px;background:#effbff;border:1px solid #bde9fa;color:#0878ad;padding:5px 10px;font-weight:850;font-size:13px}.footer{text-align:center;color:var(--muted);font-size:14px;margin-top:34px}@media(max-width:760px){.wrap{width:min(100% - 22px,960px);padding:24px 0}.hero{border-radius:25px;padding:30px 22px}.hero:after{font-size:42px;right:20px;top:16px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="tag">OmiNote｜入口</div>
      <h1>這裡放一頁式網站</h1>
      <p class="lead">這個首頁只當入口，不放完整內容。之後每個主題都會放到自己的資料夾，網址乾淨、好分享，也不會全部擠成海鮮粥。</p>
    </section>

    <h2 class="section-title">目前頁面</h2>
    <div class="grid">
      <a class="card" href="pages/toucheng-whale-watching/">
        <div class="emoji">🐳</div>
        <h2>頭城烏石港賞鯨行程指南</h2>
        <p>給家人看的決策版：方案比較、海況模擬、適不適合報名、行前準備。</p>
        <span class="badge">開啟頁面</span>
      </a>
    </div>

    <p class="footer">OmiNote｜GitHub Pages</p>
  </main>
</body>
</html>
